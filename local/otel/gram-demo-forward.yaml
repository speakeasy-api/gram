# Local development only. Merged on top of the LGTM image's own collector
# config via OTELCOL_EXTRA_ARGS, so everything the image already does --- the
# traces, metrics and logs pipelines into Tempo, Prometheus and Loki --- is
# untouched. This file only adds a second logs pipeline beside them.
#
# Why it exists: `mise run demo:agent-activity` drives real Claude Code
# sessions and wants each one attributed to a seeded demo user. Claude Code
# gives no way to override the record-level `user.email` it reports --- that
# comes from the signed-in Anthropic account --- but it does honour
# OTEL_RESOURCE_ATTRIBUTES. So the generator marks each run with the identity
# it wants, in the resource, and this pipeline moves that value onto the
# attribute Gram's dialect actually reads into agent_events.user_email.
#
# This container is shared by every worktree on the machine, so the pipeline
# is gated: it forwards only records carrying the generator's marker and is
# inert for everyone else, including the Gram server's own telemetry, which
# arrives on this same port.

extensions:
  # The generator mints its own short-lived API key per run and sends it as a
  # request header. Lifting it off the incoming request keeps that credential
  # out of this shared container's configuration and environment entirely.
  headers_setter/gram_demo:
    headers:
      - key: Gram-Key
        from_context: gram-key
        action: upsert
      - key: Gram-Project
        from_context: gram-project
        action: upsert

receivers:
  otlp:
    protocols:
      http:
        # Required for the `from_context` lookups above to see request headers.
        include_metadata: true

processors:
  # Everything the generator did not mark is dropped here rather than
  # forwarded. Without this, the Gram server's own OTLP traffic would be
  # posted into Gram's agent-event ingest, which is both wrong and a loop.
  filter/gram_demo:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["gram.demo.user_email"] == nil'

  transform/gram_demo:
    error_mode: ignore
    log_statements:
      - set(log.attributes["user.email"], resource.attributes["gram.demo.user_email"])

  # The shared `batch` cannot be reused here. Batching merges requests from
  # different clients and discards their metadata, which is exactly what
  # headers_setter reads, so the forwarded request would arrive at Gram with
  # no credentials and be rejected. Naming the keys makes the processor keep
  # one batch per credential and carry that metadata through.
  batch/gram_demo:
    metadata_keys: [gram-key, gram-project]

exporters:
  otlphttp/gram_demo:
    # host.docker.internal because localhost inside this container is the
    # container. The default follows the main worktree; a worktree whose
    # server port was remapped exports GRAM_DEMO_OTLP_LOGS_ENDPOINT itself.
    logs_endpoint: ${env:GRAM_DEMO_OTLP_LOGS_ENDPOINT:-https://host.docker.internal:8080/rpc/hooks.otel/v1/logs}
    # This exporter defaults to protobuf. Gram's hook ingest is the endpoint
    # Claude Code talks to with OTEL_EXPORTER_OTLP_PROTOCOL=http/json, so send
    # it the encoding it expects rather than the exporter's default.
    encoding: json
    auth:
      authenticator: headers_setter/gram_demo
    tls:
      # The local server serves HTTPS with a mkcert certificate trusted on the
      # host but unknown inside this container. Local dev, one hop to
      # localhost, so skip verification rather than mounting the mkcert root.
      insecure_skip_verify: true

service:
  # Lists replace rather than merge, so the image's own health_check has to be
  # named again here or the container loses it.
  extensions: [health_check, headers_setter/gram_demo]
  pipelines:
    logs/gram_demo:
      receivers: [otlp]
      processors: [filter/gram_demo, transform/gram_demo, batch/gram_demo]
      exporters: [otlphttp/gram_demo]
