provider:
  users:
    - email: eng@speakeasyapi.dev
      name: Engineering User
      hd: speakeasyapi.dev
      picture: https://lh3.googleusercontent.com/a/default-user
      email_verified: true
    - email: marketing@speakeasy.com
      name: Marketing User
      hd: speakeasy.com
      picture: https://lh3.googleusercontent.com/a/default-user
      email_verified: true
    - email: notallowed@gmail.com
      name: External user
      picture: https://lh3.googleusercontent.com/a/default-user
    - email: unverified@speakeasy.com
      name: Unverified User
      picture: https://lh3.googleusercontent.com/a/default-user
      email_verified: false
  oauth_clients:
    - client_id: gram-local.apps.googleusercontent.com
      client_secret: GOCSPX-example_secret
      name: Gram (Google)
      redirect_uris:
        # Both origins are registered so admin login works whether the browser is
        # on this machine or on another one reaching it by hostname (see
        # zero:remap-hostname). Without remote access the two are identical and
        # the duplicate is harmless.
        - "${GRAM_ADMIN_SERVER_URL}/admin/auth.callback"
        - "https://localhost:${GRAM_ADMIN_DASHBOARD_PORT}/admin/auth.callback"
