# Per-worktree infra. `git:workinit` sets a unique COMPOSE_PROJECT_NAME and
# `zero:remap-ports` remaps the host ports, so each worktree gets its own
# Postgres, Redis, ClickHouse, and Temporal without colliding.
# Services shared safely through explicit worktree namespaces live in
# compose.shared.yml and run once for the whole machine: Pub/Sub,
# Presidio, and the LGTM observability stack.
name: ${COMPOSE_PROJECT_NAME:-gram}

services:
  gram-temporal:
    image: temporalio/temporal:1.8.1@sha256:59561b9ef060eaeb1f46cb6a1842d6cbdd8a393eb3b6d315ecef5fe2f0b1d7a6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-17233}:7233"
      - "127.0.0.1:${TEMPORAL_WEB_PORT:-18233}:8233"
    environment:
      # The dev server is a single Go process, so its footprint is governed by
      # the Go runtime rather than by cgroup limits. GOMEMLIMIT is a soft heap
      # target, not a hard RSS cap. Each server handles only this worktree.
      GOMEMLIMIT: 256MiB
      # Per-P allocator caches and GC workers scale with core count; the dev
      # server never needs the whole host.
      GOMAXPROCS: 4
    entrypoint: ["temporal"]
    command: [
        "server",
        "start-dev",
        "--ip",
        "0.0.0.0",
        "--ui-ip",
        "0.0.0.0",
        "--namespace",
        "${TEMPORAL_NAMESPACE:-default}",
        "--db-filename",
        "/home/temporal/dev.db",
        # Allow readers alongside a writer and wait briefly for SQLite locks.
        "--sqlite-pragma",
        "journal_mode=WAL",
        "--sqlite-pragma",
        "synchronous=NORMAL",
        "--sqlite-pragma",
        "busy_timeout=5000",
        # Temporal's history cache is count-bounded by default (128k mutable
        # state entries host-wide), which puts no ceiling on bytes. Switch it to
        # a size-based limit so the live heap stays bounded and GOMEMLIMIT does
        # not turn into GC thrash. 1.31 dropped the shard-level cache, so
        # hostLevelCacheMaxSizeBytes is the only size knob left.
        "--dynamic-config-value",
        "history.cacheSizeBasedLimit=true",
        "--dynamic-config-value",
        "history.hostLevelCacheMaxSizeBytes=67108864",
        "--dynamic-config-value",
        "history.eventsCacheMaxSizeBytes=2097152",
        "--dynamic-config-value",
        'history.cacheTTL="5m"',
        "--dynamic-config-value",
        'history.eventsCacheTTL="5m"',
        # A local worker does not need the default four task queue
        # partitions, each of which carries its own manager and buffers.
        "--dynamic-config-value",
        "matching.numTaskqueueReadPartitions=1",
        "--dynamic-config-value",
        "matching.numTaskqueueWritePartitions=1",
      ]
    volumes:
      # A new name avoids reviving volumes from the previous local setup.
      - temporal_local_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 30s
      retries: 5

  gram-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run only on FIRST container start (empty data volume).
      # Currently used to create the gram_devidp database for the dev-idp
      # binary; see local/postgres-init/01-create-gram-devidp.sql.
      - ./local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  gram-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - cache_data:/var/lib/gram-cache/data
    ports:
      - "${GRAM_REDIS_CACHE_PORT}:35299"
    command: redis-server --port 35299 --requirepass xi9XILbY

  litellm:
    profiles: [litellm]
    image: ghcr.io/berriai/litellm:v1.94.0@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_DEV_KEY}
    volumes:
      - ./local/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:26.2.19.43@sha256:c2f2605585899d5103a0447daadbc0005f362200d5f0fcca7f40db3ca0dd36dd
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9440"
    environment:
      CLICKHOUSE_DB: gram
      CLICKHOUSE_USER: gram
      CLICKHOUSE_PASSWORD: gram
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./local/clickhouse/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./local/clickhouse/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./local/clickhouse/config.d/ssl.xml:/etc/clickhouse-server/config.d/ssl.xml:ro
      - ./local/clickhouse/users.d/dev_profile.xml:/etc/clickhouse-server/users.d/dev_profile.xml:ro
      - ./local/clickhouse/certs:/etc/clickhouse-server/certs:ro
      - ./local/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  mcp-registry-db:
    profiles: [local-registry]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp_registry
      POSTGRES_PASSWORD: mcp_registry
      POSTGRES_DB: mcp_registry
    volumes:
      - mcp_registry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  temporal_local_data:
    driver: local
  postgres_data:
    driver: local
  cache_data:
    driver: local
  clickhouse_data:
    driver: local
  mcp_registry_data:
    driver: local
