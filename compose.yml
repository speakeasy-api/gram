# Per-worktree infra. `git:workinit` sets a unique COMPOSE_PROJECT_NAME (and
# `zero:remap-ports` remaps the host ports) so each worktree gets its own stack
# — postgres, clickhouse, temporal, etc. — without colliding.
# Services that hold no per-worktree state live in compose.shared.yml instead
# and run as a single copy for the whole machine: the Presidio analyzer and the
# LGTM observability stack.
name: ${COMPOSE_PROJECT_NAME:-gram}

services:
  gram-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run only on FIRST container start (empty data volume).
      # Currently used to create the gram_devidp database for the dev-idp
      # binary; see local/postgres-init/01-create-gram-devidp.sql.
      - ./local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  gram-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - cache_data:/var/lib/gram-cache/data
    ports:
      - "${GRAM_REDIS_CACHE_PORT}:35299"
    command: redis-server --port 35299 --requirepass xi9XILbY

  gram-temporal:
    # The CLI image, not temporalio/server: as of 1.31 the server image no
    # longer bundles the `temporal` binary that `server start-dev` needs.
    # CLI 1.8.1 embeds Server 1.31.2 and UI 2.50.1.
    image: temporalio/temporal:1.8.1
    restart: unless-stopped
    ports:
      - "${TEMPORAL_PORT}:7233"
      - "${TEMPORAL_WEB_PORT}:8233"
    environment:
      # The dev server is a single Go process, so its footprint is governed by
      # the Go runtime rather than by cgroup limits. GOMEMLIMIT is a soft heap
      # ceiling the GC actively works to stay under, which is what caps memory
      # in sandboxes where `deploy.resources.limits` cannot be applied.
      GOMEMLIMIT: 256MiB
      # Per-P allocator caches and GC workers scale with core count; the dev
      # server never needs the whole host.
      GOMAXPROCS: 4
    entrypoint: ["temporal"]
    command: [
        "server",
        "start-dev",
        "--ip",
        "${TEMPORAL_IP:-0.0.0.0}",
        "--ui-ip",
        "${TEMPORAL_IP:-0.0.0.0}",
        "--namespace",
        "default",
        "--db-filename",
        "/home/temporal/dev.db",
        # Temporal's history cache is count-bounded by default (128k mutable
        # state entries host-wide), which puts no ceiling on bytes. Switch it to
        # a size-based limit so the live heap stays bounded and GOMEMLIMIT does
        # not turn into GC thrash. 1.31 dropped the shard-level cache, so
        # hostLevelCacheMaxSizeBytes is the only size knob left.
        "--dynamic-config-value",
        "history.cacheSizeBasedLimit=true",
        "--dynamic-config-value",
        "history.hostLevelCacheMaxSizeBytes=67108864",
        "--dynamic-config-value",
        "history.eventsCacheMaxSizeBytes=2097152",
        "--dynamic-config-value",
        'history.cacheTTL="5m"',
        "--dynamic-config-value",
        'history.eventsCacheTTL="5m"',
        # A single local worker does not need the default 4 task queue
        # partitions, each of which carries its own manager and buffers.
        "--dynamic-config-value",
        "matching.numTaskqueueReadPartitions=1",
        "--dynamic-config-value",
        "matching.numTaskqueueWritePartitions=1",
      ]
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 30s
      retries: 5

  litellm:
    profiles: [litellm]
    image: ghcr.io/berriai/litellm:v1.94.0@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_DEV_KEY}
    volumes:
      - ./local/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    build:
      context: ./local/clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9440"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: gram
      CLICKHOUSE_PASSWORD: gram
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0-emulators@sha256:1b083a6a9647024a98d4f38c2b51906a0f61ca36adcba11672b8933544962efe
    restart: unless-stopped
    environment:
      # The emulator is a JVM app (cloud-pubsub-emulator-all.jar) launched with
      # no -Xmx, so its default max heap is 1/4 of container-visible RAM -- the
      # whole Docker VM, several GB. An emulator serving one developer never
      # needs that, and the unbounded ceiling is what makes N worktrees
      # dangerous. `gcloud beta emulators pubsub start` has no pass-through flag
      # for JVM options, so set the cap through the JVM's own env var.
      JAVA_TOOL_OPTIONS: -Xmx128m
    ports:
      - "${PUBSUB_EMULATOR_PORT}:8085"
    command:
      [
        "gcloud",
        "beta",
        "emulators",
        "pubsub",
        "start",
        "--host-port=0.0.0.0:8085",
      ]

  mcp-registry-db:
    profiles: [local-registry]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp_registry
      POSTGRES_PASSWORD: mcp_registry
      POSTGRES_DB: mcp_registry
    volumes:
      - mcp_registry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  tunnel-postgres-mcp:
    profiles: [tunnel]
    image: gram-postgres-mcp-streamable:07eb329c8c48
    build:
      context: https://github.com/crystaldba/postgres-mcp.git#07eb329c8c48e49640e0d1b5b35465d4d024c3ee
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URI: postgresql://${DB_USER}:${DB_PASSWORD}@gram-db:5432/${DB_NAME}
    command:
      [
        "--access-mode=unrestricted",
        "--transport=streamable-http",
        "--streamable-http-host=0.0.0.0",
        "--streamable-http-port=9000",
      ]
    depends_on:
      gram-db:
        condition: service_healthy

  tunnel-agent:
    profiles: [tunnel]
    image: golang:1.26.4-bookworm
    restart: unless-stopped
    network_mode: "service:tunnel-postgres-mcp"
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      TUNNEL_GATEWAY_URL: ${TUNNEL_AGENT_GATEWAY_URL:-ws://host.docker.internal:8090/connect}
      TUNNEL_KEY: ${TUNNEL_LOCAL_KEY:-}
      TUNNEL_LOCAL_MCP_URL: http://127.0.0.1:9000/mcp
      TUNNEL_SERVICE_VERSION: 0.3.0
      TUNNEL_METADATA: '{"environment":"local","server":"postgres-mcp","database":"gram","transport":"streamable-http"}'
    command: ["go", "run", "./tunnel/cmd/tunnel-agent"]
    depends_on:
      tunnel-postgres-mcp:
        condition: service_started

volumes:
  postgres_data:
    driver: local
  cache_data:
    driver: local
  temporal_data:
    driver: local
  clickhouse_data:
    driver: local
  mcp_registry_data:
    driver: local
