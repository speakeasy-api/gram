<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96">
  <!-- Adapts to the browser's color scheme rather than the theme chosen inside
       Gram: the tab strip follows the OS/browser, so keying the icon off the
       app theme left a white mark on a light tab. The artwork is the same
       favicon.png / favicon-dark.png pair, inlined so one file can do both. -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="96" height="96" xlink:href="data:image/png;base64,"/>
  <image class="dark" width="96" height="96" xlink:href="data:image/png;base64,"/>
</svg>
