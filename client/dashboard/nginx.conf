server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime values are substituted into this template by the nginx
    # entrypoint at container start. GRAM_CDN_URL rewrites asset URLs so
    # browsers fetch static assets through the CDN; when empty, assets stay
    # same-origin. GRAM_ADMIN_SERVER_URL and GRAM_DASHBOARD_CONFIG are written
    # to index.html by the container entrypoint. Only HTML is rewritten here
    # (sub_filter_types defaults to text/html); JS and CSS reference their
    # sub-resources relative to their own URL, so they follow automatically
    # (see renderBuiltUrl in vite.config.ts).
    sub_filter_once off;
    sub_filter '"/assets/' '"${GRAM_CDN_URL}/assets/';

    # CLI install scripts, so `curl -fsSL https://<platform host>/cli.sh | bash`
    # works on every platform host. Exact matches win over the SPA fallback,
    # which would otherwise answer with index.html. go.getgram.ai/cli.sh and
    # /cli.ps1 point at the same files.
    location = /cli.sh {
        return 302 https://raw.githubusercontent.com/speakeasy-api/gram/refs/heads/main/install-cli.sh;
    }
    location = /cli.ps1 {
        return 302 https://raw.githubusercontent.com/speakeasy-api/gram/refs/heads/main/install-cli.ps1;
    }

    # OAuth and OpenID Connect discovery documents. An MCP client that finds no
    # metadata for a server URL (for example a renamed slug) falls back to
    # these paths on the origin, and the SPA fallback would answer with a 200
    # index.html the client then fails to parse as JSON. The ingress sends the
    # per-server documents the server publishes elsewhere, so only paths
    # nothing publishes reach this container. Other /.well-known files, such
    # as security.txt, are still served from the build output. The empty types
    # block makes default_type apply even when the path ends in an extension.
    location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration)(/|$) {
        types { }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404 '{"error":"not_found","error_description":"No OAuth or OpenID metadata is published at this URL. Check the MCP server URL in your client configuration. The current URL can be copied from the MCP page in the Speakeasy dashboard."}';
    }

    # Dynamic client registration on the origin (RFC 7591). MCP clients POST
    # here when no authorization server metadata names a registration
    # endpoint, and nginx would answer with a 405 HTML page. Browsers still
    # GET the dashboard's /register page, which falls back to index.html like
    # any SPA route and picks up the HTML headers below.
    location = /register {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404 '{"error":"not_found","error_description":"No OAuth client registration is available at this URL. Check the MCP server URL in your client configuration. The current URL can be copied from the MCP page in the Speakeasy dashboard."}';
        }
        try_files $uri /index.html;
    }

    # Public resources embedded by customer-hosted pages. Keep both CORS and
    # CORP permissive: the sticker logo is intentionally loaded cross-site.
    location ^~ /external/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Stable font URLs are also used by externally hosted integrations.
    # Do not let missing fonts fall through to the SPA or lose CORS on errors.
    location ^~ /fonts/ {
        try_files $uri =404;
        expires 1d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Serve static assets with an efficient cache policy. Note: with
    # GRAM_CDN_URL set, browsers fetch /assets from the CDN, whose origin is
    # a storage bucket rather than this nginx; the load balancer in front of
    # that bucket sets its own Access-Control-Allow-Origin: *, mirroring the
    # header here. These headers still cover anything served
    # directly from this container: CDN disabled (GRAM_CDN_URL empty), local
    # runs, or clients hitting the origin host. Vite emits
    # <script type="module" crossorigin> and stylesheet links, and devtools
    # fetch sourcemaps in CORS mode, so cross-origin consumers need the
    # header or the fetch fails with a NetworkError.
    location ~* \.(js|css|map)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Serve HTML with no cache. Nothing on this host wants search indexing —
    # it is either behind login or a tokenized public share page — so noindex
    # everything ("always" keeps the header on error responses too).
    #
    # The three cross-origin headers repeat in both HTML locations below.
    # add_header inside a location discards every add_header inherited from
    # server, so a single server-level copy would vanish from every location
    # in this file that sets its own headers. Keep them off the asset
    # locations above: /assets and /external are fetched by other origins on
    # purpose, and a same-origin policy would block those loads.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
