server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The favicons keep their names across builds, so they can only carry a
    # short cache. This block precedes the immutable ones because nginx takes
    # the first regex location that matches.
    location ~* ^/favicon\.(svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Serve fingerprinted build output with an efficient cache policy. Vite puts
    # a content hash in each of these filenames, so they can be cached immutably.
    location ~* \.(js|css|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve HTML with no cache. This host is an internal admin tool on a
    # private network, so noindex everything ("always" keeps the header on
    # error responses too).
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
