## This file contains configuration overrides that are used when building the
## Gram dashboard with Vite for production.

[env]
## Both the Gram server and dashboard (client) are accessed on
## https://app.getgram.ai.
GRAM_SERVER_URL = false
## Unset for the same reason, and it matters more: the dashboard build PREFERS
## this over GRAM_SERVER_URL, so on a machine that opted into remote dev access
## (zero:remap-hostname) it would bake that machine's hostname into a production
## bundle.
GRAM_SERVER_PUBLIC_URL = false
## Unset on purpose: one image serves every environment, so any value here
## would send the dev admin dashboard into production data. Disables the link.
GRAM_APP_URL = false
## GRAM_API_URL is used primarily during local development. That may change in
## the future when we create separate builds per environment but until then we
## should unset it so it is not baked into bundles built with vite.
GRAM_API_URL = false
## Not needed for production builds, but can be useful for local development.
GRAM_SSL_CERT_FILE = false
GRAM_SSL_KEY_FILE = false
## Not needed for production builds, used by vite dev server.
VITE_DEV_HOSTNAMES = false
