edition = "2024";

package gram.networkingress.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/networkingress/v1;networkingressv1";

message Reconciler {
  option (gcp.pubsub.v1.subscription) = {
    topic: "gram.networkingress.v1.ReconcileRequested"
    ack_deadline: {seconds: 60}
    retention: {seconds: 604800}
    retry_policy: {
      minimum_backoff: {seconds: 10}
      maximum_backoff: {seconds: 600}
    }
    dead_letter: {max_delivery_attempts: 10}
  };
}
