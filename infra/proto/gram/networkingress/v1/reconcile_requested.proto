edition = "2024";

package gram.networkingress.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/networkingress/v1;networkingressv1";

// ReconcileRequested wakes the authoritative lifecycle worker. Desired state and
// credentials are loaded by the activity, never transported in this message.
message ReconcileRequested {
  string ingress_id = 1;
  string temporal_task_queue = 2;

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {seconds: 604800}
  };
}
