edition = "2024";

package gram.otel.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/otel/v1;otelv1";

// InboundLogRecord represents an OTLP log record received by Gram's ingest edge.
//
// NOTICE: THIS IS A CARBON COPY OF `./log_record.proto` AND MUST BE KEPT IN SYNC.
//
// It is a wire-compatible superset of opentelemetry.proto.logs.v1.LogRecord.
// OTLP fields retain their exact field numbers and wire types. Gram additions
// live at 1000+, where an OTLP parser treats them as unknown fields.
message InboundLogRecord {
  reserved 4;

  fixed64 time_unix_nano = 1;
  SeverityNumber severity_number = 2;
  string severity_text = 3;
  AnyValue body = 5;
  repeated KeyValue attributes = 6;
  uint32 dropped_attributes_count = 7;
  fixed32 flags = 8;
  bytes trace_id = 9;
  bytes span_id = 10;
  fixed64 observed_time_unix_nano = 11;
  string event_name = 12;

  // Log records have no intrinsic identity. The ingest edge assigns this stable
  // key before publishing so retries through downstream topics remain dedupable.
  string record_id = 1000;

  Resource resource = 1001;
  string resource_schema_url = 1002;
  InstrumentationScope scope = 1003;
  string scope_schema_url = 1004;
  Provenance provenance = 1005;

  message Provenance {
    string source = 1;
    string organization_id = 2;
    string project_id = 3;
  }

  message Resource {
    reserved 3;

    repeated KeyValue attributes = 1;
    uint32 dropped_attributes_count = 2;
  }

  message InstrumentationScope {
    string name = 1;
    string version = 2;
    repeated KeyValue attributes = 3;
    uint32 dropped_attributes_count = 4;
  }

  enum SeverityNumber {
    SEVERITY_NUMBER_UNSPECIFIED = 0;
    SEVERITY_NUMBER_TRACE = 1;
    SEVERITY_NUMBER_TRACE2 = 2;
    SEVERITY_NUMBER_TRACE3 = 3;
    SEVERITY_NUMBER_TRACE4 = 4;
    SEVERITY_NUMBER_DEBUG = 5;
    SEVERITY_NUMBER_DEBUG2 = 6;
    SEVERITY_NUMBER_DEBUG3 = 7;
    SEVERITY_NUMBER_DEBUG4 = 8;
    SEVERITY_NUMBER_INFO = 9;
    SEVERITY_NUMBER_INFO2 = 10;
    SEVERITY_NUMBER_INFO3 = 11;
    SEVERITY_NUMBER_INFO4 = 12;
    SEVERITY_NUMBER_WARN = 13;
    SEVERITY_NUMBER_WARN2 = 14;
    SEVERITY_NUMBER_WARN3 = 15;
    SEVERITY_NUMBER_WARN4 = 16;
    SEVERITY_NUMBER_ERROR = 17;
    SEVERITY_NUMBER_ERROR2 = 18;
    SEVERITY_NUMBER_ERROR3 = 19;
    SEVERITY_NUMBER_ERROR4 = 20;
    SEVERITY_NUMBER_FATAL = 21;
    SEVERITY_NUMBER_FATAL2 = 22;
    SEVERITY_NUMBER_FATAL3 = 23;
    SEVERITY_NUMBER_FATAL4 = 24;
  }

  message AnyValue {
    reserved 8;

    oneof value {
      string string_value = 1;
      bool bool_value = 2;
      int64 int_value = 3;
      double double_value = 4;
      ArrayValue array_value = 5;
      KeyValueList kvlist_value = 6;
      bytes bytes_value = 7;
    }
  }

  message ArrayValue {
    repeated AnyValue values = 1;
  }

  message KeyValueList {
    repeated KeyValue values = 1;
  }

  message KeyValue {
    reserved 3;

    string key = 1;
    AnyValue value = 2;
  }

  option (gcp.pubsub.v1.topic) = {};
}
