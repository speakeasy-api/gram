edition = "2024";

package gram.role_distribution.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/role_distribution/v1;roledistributionv1";

// Failed deliveries retry with backoff until retention expires; there is no dead-letter topic.
message RoleDistributionSetupHandler {
  option (gcp.pubsub.v1.subscription) = {
    topic: "gram.role_distribution.v1.RoleDistributionSetupRequestedV1"
    ack_deadline: {seconds: 60}
    retention: {seconds: 604800}
    retry_policy: {
      minimum_backoff: {seconds: 10}
      maximum_backoff: {seconds: 600}
    }
  };
}
