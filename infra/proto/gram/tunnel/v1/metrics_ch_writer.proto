edition = "2024";
package gram.tunnel.v1;
import "gcp/pubsub/v1/options.proto";
option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/tunnel/v1;tunnelv1";
message MetricsCHWriter {
  option (gcp.pubsub.v1.subscription) = {
    topic: "gram.tunnel.v1.MetricsSnapshot"
    ack_deadline: {seconds: 60}
    retention: {seconds: 604800}
    retain_acked_messages: false
    retry_policy: {minimum_backoff: {seconds: 10} maximum_backoff: {seconds: 600}}
    dead_letter: {max_delivery_attempts: 10}
  };
}
