edition = "2024";

package gram.conversation.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/conversation/v1;conversationv1";

// Message is a snapshot of one persisted conversation message.
// Producers publish atomically with persistence through the outbox, including
// successful correlated provenance promotions. Exact conflict no-ops emit nothing.
// Delivery is at-least-once; each publication's snapshot survives redelivery.
// Multiple publications can share id: downstream consumers decide whether a
// changed snapshot requires processing. This is not a streaming chunk contract.
message Message {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_SYSTEM = 1;
    ROLE_DEVELOPER = 2;
    ROLE_USER = 3;
    ROLE_ASSISTANT = 4;
    ROLE_TOOL = 5;
  }

  // Attribution captured when ingestion produces this snapshot. Message user,
  // billing user and provider account are independent facts; consumers must not
  // substitute one for another. Missing fields mean unknown or unassigned.
  message Provenance {
    // Canonical normalized ingestion source.
    string source = 1;
    string external_message_id = 2;
    // Gram user ID attached to the persisted message. Identifies the person the
    // message is attributed to, not necessarily its author: assistant responses
    // can carry the requesting user's ID. Does not allocate billing usage.
    string user_id = 3;
    // Opaque user ID reported by the source system, not a Gram user/account ID.
    // Interpret within organization_id and source. Can exist without user_id
    // when ingestion has not resolved the external identity to a Gram user.
    string external_user_id = 4;
    // Gram assistant UUID associated with the workload, supplied by the producer.
    // Identifies an assistant resource, not a human user or provider account.
    string assistant_id = 5;
    string provider = 6;
    string model = 7;

    // Source replay marker, not Pub/Sub redelivery.
    bool replayed = 8;

    // Adapter slug reported by ingestion; distinct from the hook source.
    string adapter = 9;
    // Original hook source before normalization, when applicable.
    string hook_source = 10;
    // Device hostname and client user agent observed by ingestion.
    string hostname = 11;
    string user_agent = 12;
    // Message actor email explicitly observed by ingestion. Not a current Gram
    // directory lookup, a billing-user email, or an inferred provider-account email.
    string user_email = 13;
    Account account = 14;
    // Gram user ID to which the ingestion producer explicitly allocates usage,
    // using the same attribution as agent-session storage metering. May differ
    // from user_id or exist without it (e.g. an assistant's generated compaction
    // message allocated to the chat owner). Interpret with organization_id.
    // This is usage attribution, not proof that a charge occurred. Absence means
    // unassigned; consumers must not fall back to user_id or an account owner.
    string billing_user_id = 15;
  }

  // The external AI account/credentials used for the source session, as resolved
  // by ingestion. Not the Gram user allocated usage or the organization's Gram
  // billing plan. Classification may be known without a persisted account ID.
  message Account {
    // UUID of Gram's user_accounts record representing the external AI account.
    // Not a Gram user ID, provider-issued account ID, or billing-user selection.
    string user_account_id = 1;
    // Gram's ingestion-time classification: "team" for company-associated
    // accounts/credentials, "personal" for personal accounts. May be inferred
    // from provider organization and identity evidence or assigned by an import
    // adapter; not necessarily a provider-reported plan or verified ownership.
    // Absence means no classification was supplied.
    string account_type = 2;
    // How the external AI account is billed: "metered" for usage-based billing,
    // "flat_rate" for subscription/seat billing; "unknown" may be supplied when
    // undetermined. Resolved from account/provider-organization configuration;
    // absence means no mode was resolved or supplied. Does not determine Gram
    // pricing or select a billing user.
    string billing_mode = 3;
  }

  // Conversation context captured with the snapshot, not persistence routing.
  message ConversationContext {
    // Source session/conversation identifier, not the Gram conversation UUID.
    // Interpret in the namespace of the tenant and source provenance.
    string external_conversation_id = 1;
    // Session working directory reported by the source adapter.
    string working_directory = 2;
  }

  // Ordered content of this message, never the full conversation.
  message Body {
    repeated Part parts = 1;

    // Original structured content, when available, in its stored JSON format.
    // This is an alternative representation of the projected text in parts,
    // not additional text to concatenate. Tool calls remain in parts.
    oneof original_content {
      ContentReference source_content = 2;
      bytes source_content_json = 3;
    }
  }

  message Part {
    oneof value {
      string text = 1;
      ToolCall tool_call = 2;

      // Asset-backed text, image, audio, or other recorded content.
      ContentReference content_reference = 3;
    }
  }

  message ToolCall {
    string id = 1;
    string name = 2;

    // Exact recorded argument string, potentially incomplete or invalid JSON.
    string arguments_json = 3;
  }

  message ContentReference {
    // Durable authenticated locator identifying immutable bytes.
    // Never an expiring signed URL.
    string uri = 1;

    string media_type = 2;
    uint64 size_bytes = 3;

    // SHA-256 of the referenced bytes, when known; exactly 32 bytes.
    bytes sha256 = 4;
  }

  // Persisted Gram message UUID; identifies the logical message across snapshots.
  string id = 1;
  string organization_id = 2;
  string project_id = 3;

  // Gram conversation UUID, mapped from the existing storage identifier.
  string conversation_id = 4;

  Role role = 5;

  // Source message time, falling back to writer-assigned time.
  string created_at = 6; // UTC RFC3339Nano.

  // Time this snapshot was produced, preserved across publication retries.
  string produced_at = 7; // UTC RFC3339Nano.

  Provenance provenance = 8;

  // For a tool response, identifies the invocation it answers.
  string tool_call_id = 9;

  // Source value. Absence does not imply successful completion.
  string finish_reason = 10;

  // Producers must supply exactly one body representation. Protobuf oneof only
  // enforces at most one: ChatMessageWriter.enqueueMessages sets an inline body
  // (including for empty messages), replacing it with a reference when oversized.
  // Consumers must reject snapshots with neither representation.
  oneof content {
    Body body = 11;

    // Protobuf-encoded gram.conversation.v1.Message.Body.
    ContentReference body_reference = 12;
  }

  // Source prompt correlation identifier (the persisted message_id field).
  // Distinct from both the Gram row id and provenance.external_message_id.
  string correlation_id = 13;

  ConversationContext conversation_context = 14;

  option (gcp.pubsub.v1.topic) = {
    retention_hint: { seconds: 345600 /* 4 days */ }
  };
}
