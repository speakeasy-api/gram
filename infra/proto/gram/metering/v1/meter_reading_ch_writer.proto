edition = "2024";

package gram.metering.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/metering/v1;meteringv1";

message MeterReadingCHWriter {
  option (gcp.pubsub.v1.subscription) = {
    topic: "gram.metering.v1.MeterReading"
    ack_deadline: {seconds: 60}
    retention: {
      seconds: 604800 /* 7 days */
    }
    retain_acked_messages: true
    retry_policy: {
      minimum_backoff: {seconds: 10}
      maximum_backoff: {seconds: 600}
    }
    dead_letter: {max_delivery_attempts: 10}
  };
}
