edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

message PresidioEnforcer {
  // The handler ACKs scanner and reply-write failures because redelivery cannot
  // rescue an inline scan. Only undecodable or malformed requests, or a
  // consumer crash or lost ack lease, leave a request unacked; it then retries
  // until retention expires. The payloads contain raw content and require
  // restricted access and retention.
  option (gcp.pubsub.v1.subscription) = {
    topic: "gram.risk.v1.PresidioEnforcement"
    ack_deadline: {seconds: 10}
    retention: {seconds: 600}
    retry_policy: {minimum_backoff: {seconds: 10}}
  };
}
