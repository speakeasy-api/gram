edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

message AccountIdentityAnalysis {
  string request_id = 1;
  string chat_message_id = 2;
  string chat_id = 3;
  string project_id = 4;
  string organization_id = 5;
  string risk_policy_id = 6;
  int64 risk_policy_version = 7;
  string created_at = 8;
  string account_type = 9;
  string email = 10;
  repeated string approved_domains = 11;

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {seconds: 604800}
  };
}
