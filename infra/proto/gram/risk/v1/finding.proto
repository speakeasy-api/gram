edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

// Finding is one risk match detected in a chat message or mediated MCP
// execution. A durable chat anchor is optional when attribution and execution
// metadata travel with the finding. dead_letter_reason is populated only on
// synthetic "could not analyze" markers emitted when a scanner exhausts its
// retry budget; it is empty on every real finding.
message Finding {
  // EnforcementOutcome records the action taken, independently of detection.
  // The lifecycle values preserve warning acknowledgement/abandonment and
  // quarantine without overloading a boolean blocked flag.
  enum EnforcementOutcome {
    ENFORCEMENT_OUTCOME_UNSPECIFIED = 0;
    ENFORCEMENT_OUTCOME_LOGGED = 1;
    ENFORCEMENT_OUTCOME_DENIED = 2;
    ENFORCEMENT_OUTCOME_WITHHELD = 3;
    ENFORCEMENT_OUTCOME_WARNED_PENDING = 4;
    ENFORCEMENT_OUTCOME_WARNED_ACKNOWLEDGED = 5;
    ENFORCEMENT_OUTCOME_WARNED_ABANDONED = 6;
    ENFORCEMENT_OUTCOME_QUARANTINED = 7;
  }

  // Presence is authoritative, including intentionally empty values. Absent
  // attribution retains project-bounded chat-anchor enrichment at ingest.
  message Attribution {
    string chat_id = 1;
    string user_id = 2;
    string external_user_id = 3;
    string assistant_id = 4;
    string message_created_at = 5; // Optional RFC3339 event time.
    string chat_source = 6;
    string team = 7;
    string user_email = 8;
  }

  // Metadata only: never arguments, results, credentials, or stream contents.
  message Execution {
    string execution_id = 1;
    string mcp_server_id = 2;
    string meta_mcp_server_id = 3;
    string toolset_id = 4;
    string tool_name = 5;
    string phase = 6; // "request" or "response"
    string mediation_surface = 7;
    string method = 8;
    string principal_kind = 9; // Credential provenance from mcpidentity only.
    bool identity_stamped = 10;
  }

  string id = 1;
  string request_id = 2;
  string chat_message_id = 3;
  string project_id = 4;
  string organization_id = 5;
  string risk_policy_id = 6;
  int64 risk_policy_version = 7;
  string created_at = 8; // Must be UTC timestamp in RFC3339 format, e.g. 2023-01-01T00:00:00Z

  string rule_id = 9;
  string description = 10;
  string match = 11;
  int32 start_pos = 12; // Byte position in string
  int32 end_pos = 13; // Byte position in string
  repeated string tags = 14;
  string source = 15; // Detection source (e.g. "gitleaks", "presidio")
  double confidence = 16; // 0.0-1.0 confidence score
  string dead_letter_reason = 17; // Non-empty => dead-letter sentinel, not a real finding
  string content_part_id = 18;

  // Set only when this message re-publishes an already-persisted finding to
  // record a manual false-positive dismissal/undo (risk.markResultsFalsePositive
  // / risk.unmarkResultsFalsePositive). Empty on every finding produced by a
  // scanner. Must be UTC RFC3339 when present, e.g. 2023-01-01T00:00:00Z.
  string false_positive_at = 19;

  // Reveal metadata: which text start_pos/end_pos index. One of content,
  // scan_surface, tool_args, json_path, derived or none; empty means
  // unknown/legacy, where reveal falls back to a verified candidate cascade.
  string surface = 20;
  // Scanner field name the finding was detected in (e.g. content, tool.args),
  // copied from the matched span. Empty when the scanner records no spans.
  string field = 21;
  // gjson path of the extracted value within field for json_path extractions.
  string path = 22;
  // Recorded tool call id anchoring the finding when the scanned text belongs
  // to a tool call. Empty when not applicable or unknown.
  string tool_call_id = 23;

  // Suppression state carried on republished findings, superseding
  // false_positive_at as part of the suppression convergence. Set only when
  // this message re-publishes an already-persisted finding to record a manual
  // suppression state change (risk.markResultsFalsePositive /
  // risk.unmarkResultsFalsePositive): excluded_at is the suppression time and
  // must be UTC RFC3339 when present. Empty on every finding produced by a
  // scanner — the ClickHouse writer computes rule-based exclusions at ingest
  // itself and stamps excluded_reason=rule there.
  string excluded_at = 24;
  // Why the finding is suppressed: "rule" (exclusion rule), "manual" (user
  // dismissal via UI or agent tool) or "automated" (offline false-positive
  // sweep). Meaningful only alongside excluded_at.
  string excluded_reason = 25;
  // Free-form suppression context: the user-supplied dismissal reason for
  // manual suppressions, the catalog reason for automated ones. Optional.
  string excluded_detail = 26;

  // Event-log kind of this message: "finding" for scanner output (dead-letter
  // sentinels included), "suppression" / "unsuppression" for republished
  // manual state changes (risk.markResultsFalsePositive and its undo). The
  // ClickHouse writer persists it so read-time dedup can rank state-change
  // rows above scanner rows for the same id — a redelivered scanner message
  // must never clobber a later dismissal. Empty on messages from producers
  // that predate the field: the writer derives "suppression" when
  // excluded_at/false_positive_at is carried and "finding" otherwise.
  string event_kind = 27;

  // Engine-comparison marker. True on findings the LLM analyzer produced
  // while the organization's risk engine mode was shadow, where the legacy
  // engines enforce the same batch and the model's verdict is recorded only
  // to be compared with theirs per message. A shadow finding is never
  // enforced and the ClickHouse writer persists it as shadow = 1, which every
  // user-facing read path filters out, so it is hidden from Risk Events, the
  // overview, signals and the Watchdog by default. False on every finding the
  // enforcing engines produce.
  bool shadow = 28;

  Attribution attribution = 29;
  Execution execution = 30;
  EnforcementOutcome enforcement_outcome = 31;

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {
      seconds: 604800 /* 7 days */
    }
  };
}
