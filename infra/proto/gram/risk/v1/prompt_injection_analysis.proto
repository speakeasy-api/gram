edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

message PromptInjectionAnalysis {
  string request_id = 1;
  string chat_message_id = 2;
  string project_id = 3;
  string organization_id = 4;
  string risk_policy_id = 5;
  int64 risk_policy_version = 6;
  string created_at = 7; // Must be UTC timestamp in RFC3339 format, e.g. 2023-01-01T00:00:00Z

  string content = 8;
  string user_id = 9;
  bool l1_enabled = 10;
  string message_type = 11;
  string body = 12;
  string tool_name = 13;
  repeated ToolCall tool_calls = 14;
  string content_part_id = 15;
  string chat_id = 24;
  string parent_chat_message_id = 25;
  string origin_risk_policy_id = 18;
  int64 origin_risk_policy_version = 19;
  string message_link_reason = 20;
  string execution_path = 21;
  string tool_call_id = 22;
  string hook_source = 23;
  // Reason no policy initiated this scan; excludes origin_risk_policy_id.
  string policy_link_reason = 26;
  // Raw external conversation ID; independent of the persisted Gram chat_id.
  string external_conversation_id = 27;

  // Bounded causal evidence captured when the event is read. These fields are
  // untrusted content and are never included in the published finding match.
  string prior_user_request = 16;
  string recent_untrusted_content = 17;

  message ToolCall {
    string name = 1;
    string arguments = 2;
  }

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {
      seconds: 604800
      /* 7 days */
    }
  };
}
