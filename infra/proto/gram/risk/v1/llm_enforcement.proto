edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

// LLMEnforcement is one sync (block/warn/quarantine lane) evaluation request
// for the fine-tuned risk model. The consumer answers over the request/reply
// Redis inbox with an EnforcementReply whose scanner is
// ENFORCEMENT_SCANNER_LLM_ANALYZER.
message LLMEnforcement {
  // The reply address travels as transport metadata (see
  // requestreply.ReplyURNAttribute), never in the payload.
  reserved 8;
  reserved reply_urn;

  string request_id = 1;
  string chat_message_id = 2;
  string project_id = 3;
  string organization_id = 4;
  string risk_policy_id = 5;
  int64 risk_policy_version = 6;
  string created_at = 7; // Must be UTC timestamp in RFC3339 format, e.g. 2023-01-01T00:00:00Z

  string content = 9;
  string content_part_id = 10;
  string chat_id = 11;
  string parent_chat_message_id = 12;
  string origin_risk_policy_id = 13;
  int64 origin_risk_policy_version = 14;
  string message_link_reason = 15;
  string execution_path = 16;
  string tool_call_id = 17;
  string tool_name = 18;
  string hook_source = 19;
  string user_id = 20;
  string message_type = 21;
  // Reason no policy initiated this scan; excludes origin_risk_policy_id.
  string policy_link_reason = 22;
  // Raw external conversation ID; independent of the persisted Gram chat_id.
  string external_conversation_id = 23;
  // True when body or tool_calls were cut to the analyzer's input caps.
  bool content_truncated = 24;
  string body = 25;
  repeated ToolCall tool_calls = 26;
  // Organization slug, carried for telemetry dimensions only.
  string organization_slug = 27;

  message ToolCall {
    // Harness-assigned tool call id, or a synthetic one when the harness
    // supplied none.
    string id = 1;
    string name = 2;
    string arguments = 3;
  }

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {seconds: 600}
  };
}
