edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

// PromptPolicyEnforcement evaluates one event against one prompt policy.
message PromptPolicyEnforcement {
  string request_id = 1;
  string chat_message_id = 2;
  string project_id = 3;
  string organization_id = 4;
  string risk_policy_id = 5;
  int64 risk_policy_version = 6;
  string created_at = 7;

  reserved 8;
  reserved reply_urn;
  string content = 9;
  string content_part_id = 10;
  string chat_id = 11;
  string parent_chat_message_id = 12;
  string origin_risk_policy_id = 13;
  int64 origin_risk_policy_version = 14;
  string message_link_reason = 15;
  string execution_path = 16;
  string tool_call_id = 17;
  string tool_name = 18;
  string hook_source = 19;
  string user_id = 20;
  string message_type = 21;
  string policy_link_reason = 22;
  string external_conversation_id = 23;
  bool content_truncated = 24;
  string body = 25;
  repeated ToolCall tool_calls = 26;
  string prompt = 27;
  bytes model_config = 28;

  message ToolCall {
    string id = 1;
    string name = 2;
    string arguments = 3;
  }

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {seconds: 600}
  };
}
