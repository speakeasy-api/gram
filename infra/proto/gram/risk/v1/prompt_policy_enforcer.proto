edition = "2024";

package gram.risk.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/risk/v1;riskv1";

message PromptPolicyEnforcer {
  option (gcp.pubsub.v1.subscription) = {
    topic: "gram.risk.v1.PromptPolicyEnforcement"
    ack_deadline: {seconds: 30}
    retention: {seconds: 600}
    retry_policy: {minimum_backoff: {seconds: 10}}
  };
}
