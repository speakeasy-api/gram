edition = "2024";

package gram.plugins.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/plugins/v1;pluginsv1";

// A maintenance hint, not desired state. Consumers must reload authoritative
// organization settings and role/plugin state; identifiers may already be gone.
// Emission is independent of marketplace publication and GitHub connectivity.
message RoleProvisioningRequested {
  string organization_id = 1;
  // Optional narrowing hints. Absent identifiers request organization-wide work.
  string role_urn = 2;
  string plugin_id = 3;
  // Global role changes fan out to organizations, including stale audiences.
  string global_role_urn = 4;
  string after_organization_id = 5;
  string after_role_urn = 6;
  // Hourly recovery uses the same bounded organization fanout.
  bool global_sweep = 7;

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {seconds: 604800}
  };
}
