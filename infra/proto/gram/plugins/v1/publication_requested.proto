edition = "2024";

package gram.plugins.v1;

import "gcp/pubsub/v1/options.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/plugins/v1;pluginsv1";

message PublicationRequested {
  string organization_id = 1;
  string project_id = 2;
  string created_by_user_id = 3;

  option (gcp.pubsub.v1.topic) = {
    retention_hint: {seconds: 604800}
  };
}
