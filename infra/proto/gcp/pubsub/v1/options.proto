edition = "2024";

package gcp.pubsub.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/speakeasy-api/gram/infra/gen/gcp/pubsub/v1;pubsubv1";

message TopicOptions {
  // Optional. Defaults to the kebab-cased proto full name of the topic-declaring
  // message (e.g. message gram.outbox.v1.Event → "gram-outbox-v1-event"). Set
  // this to route publishing to a shared, externally-owned topic so several
  // messages can map onto a single topic ID. This overrides the topic ID only:
  // a message's generated PubSubSchema is always named after the message, never
  // after this field, because the schema describes that one message's shape.
  string name = 1;
  google.protobuf.Duration retention_hint = 2;
  map<string, string> labels = 3;
}

message SubscriptionOptions {
  // Optional. Defaults to the kebab-cased proto full name of the subscription
  // marker message (e.g. message gram.outbox.v1.Processor →
  // "gram-outbox-v1-processor").
  string name = 1;
  google.protobuf.Duration retention = 2;
  bool retain_acked_messages = 3;
  google.protobuf.Duration ack_deadline = 4;
  google.protobuf.Duration expiration_ttl = 5;
  RetryPolicy retry_policy = 6;
  map<string, string> labels = 7;
  string filter = 8;
  DeadLetterPolicy dead_letter = 9;
  // Required. Proto FullName of the topic-declaring message this subscription
  // consumes from (e.g. "outbox.event.v1.Event"). Validated against the
  // discovered topic set during reconciliation.
  string topic = 10;
}

message RetryPolicy {
  google.protobuf.Duration minimum_backoff = 1;
  google.protobuf.Duration maximum_backoff = 2;
}

// StorageCodec selects the analytical representation written to Cloud Storage.
enum StorageCodec {
  // Permanently resolves to PARQUET, including when the field is omitted.
  STORAGE_CODEC_UNSPECIFIED = 0;
  STORAGE_CODEC_PARQUET = 1;
}

// StoragePartitioning selects the directories beneath the storage subscription
// marker's fully qualified proto name. Built-in partitions use UTC receipt time.
enum StoragePartitioning {
  // Permanently resolves to HIVE_DAILY, including when the field is omitted.
  STORAGE_PARTITIONING_UNSPECIFIED = 0;
  STORAGE_PARTITIONING_HIVE_DAILY = 1;
  STORAGE_PARTITIONING_HIVE_HOURLY = 2;
  STORAGE_PARTITIONING_HIVE_EXTERNAL = 3;
}

// StorageSubscriptionOptions declares a Go-owned analytical storage consumer.
// The storage runner owns encoding, uploads and acknowledgment; ordinary
// application subscriber helpers must not consume this marker.
message StorageSubscriptionOptions {
  // Defaults to the kebab-cased full name of the subscription marker.
  string name = 1;
  google.protobuf.Duration retention = 2;
  bool retain_acked_messages = 3;
  google.protobuf.Duration ack_deadline = 4;
  google.protobuf.Duration expiration_ttl = 5;
  RetryPolicy retry_policy = 6;
  map<string, string> labels = 7;
  string filter = 8;
  DeadLetterPolicy dead_letter = 9;
  // Required. Full name of a topic-declaring message with an attached schema.
  // Its payload must be self-contained and nonrecursive.
  string topic = 10;
  // Required logical bucket name. Deployment resolves the globally unique GCS
  // name and supplies the same mapping to Config Connector and the Go runner.
  string bucket = 11;
  StorageCodec codec = 12;
  StoragePartitioning partitioning = 13;
  // Required only for HIVE_EXTERNAL: Pub/Sub attribute containing a relative
  // key=value/key=value suffix. Missing or malformed values are acked, discarded
  // and counted by the runner, rather than retried or dead-lettered.
  string partition_attribute = 14;
  // Required only for HIVE_EXTERNAL: exact ordered keys in the attribute value.
  // Keys are preserved verbatim, without the built-in modes' part__ prefix.
  // Changing these keys after writing data requires a new marker/storage prefix.
  repeated string partition_keys = 15;
}

message DeadLetterPolicy {
  // DLQ topic ID. If unset, defaults to "<subscription-name>-dlq". The DLQ
  // topic carries the same message schema as the source topic and is created
  // automatically during reconciliation; no separate proto declaration is
  // needed.
  string name = 1;
  int32 max_delivery_attempts = 2;
}

extend google.protobuf.MessageOptions {
  TopicOptions topic = 50001;
  SubscriptionOptions subscription = 50002;
  StorageSubscriptionOptions storage_subscription = 50003;
}
