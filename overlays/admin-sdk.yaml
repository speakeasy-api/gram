overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Admin SDK policy
  version: 0.0.0
actions:
  # HTTP int64 query values must not pass through JavaScript Number. Speakeasy's
  # string/bigint mapping generates native bigint and lossless decimal strings.
  # The server still enforces the documented nonnegative signed-int64 range.
  # https://www.speakeasy.com/docs/sdks/customize/data-model/complex-numbers
  - target: $.paths['/admin/organizations.list'].get.parameters[?@.name=='min_members' || @.name=='max_members'].schema.minimum
    remove: true
  - target: $.paths['/admin/organizations.list'].get.parameters[?@.name=='min_members' || @.name=='max_members'].schema
    update:
      type: string
      format: bigint
  # Public images are raw binary, not the default Goa JSON response.
  - target: $.paths['/admin/assets.serveImage'].get.responses['200'].content
    remove: true
  - target: $.paths['/admin/assets.serveImage'].get.responses['200']
    update:
      content:
        image/*:
          schema:
            type: string
            format: binary
            description: PNG, JPEG, GIF or WebP image bytes; Content-Type preserves the stored image MIME type.
  # Raw uploads must expose a binary body to generated browser clients.
  - target: $.paths['/admin/assets.uploadImage'].post
    update:
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  # Retain only operations owned by the standalone Admin service.
  - target: $.paths.*[?count(@.tags[?@=='admin'])==0]
    remove: true
  - target: $.paths[?length(@)==0]
    remove: true
  - target: $.tags[?@.name!='admin']
    remove: true
  # Browser requests authenticate with the ambient same-origin Admin cookie.
  - target: $.paths..security
    remove: true
  - target: $.components.securitySchemes["admin_auth_header_Authorization"]
    remove: true
  - target: $.servers[0].url
    update: /
  # Goa inlines string enums, and an unnamed one would claim the generated name
  # Source from the MCP server health model.
  - target: $.components.schemas.AdminOrganizationHooksRollout.properties.source
    update:
      x-speakeasy-name-override: AdminHooksRolloutSource
  # Goa's service-method separator is not a valid generated operation name.
  - target: $.paths.*[?@.operationId=='admin#logout']
    update:
      operationId: adminLogout
      x-speakeasy-name-override: logout
  # Keep resource-local SDK methods from repeating the admin namespace.
  - target: $.paths.*[?@.operationId=='adminBulkUpdateAccountType']
    update:
      x-speakeasy-name-override: bulkUpdateAccountType
  - target: $.paths.*[?@.operationId=='adminCancelStripeSubscription']
