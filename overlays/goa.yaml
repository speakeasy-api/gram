overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Edits to plug gaps in OpenAPI generated by Goa
  version: 0.0.0
actions:
  - target: $.components.securitySchemes["function_id_header_Gram-Function-ID"]
    remove: true
  - target: $.components.securitySchemes["function_token_header_Gram-Function-Token"]
    remove: true
  - target: $.components.schemas.Error
    update:
      x-speakeasy-name-override: ServiceError
  # Goa flattens named string aliases. Restore stable killswitch enum schemas
  # before SDK generation so they cannot perturb unrelated exported names.
  - target: $.components.schemas
    update:
      KillswitchCapabilityKey: { type: string, enum: [mcp_tool_calls] }
      KillswitchStatus:
        { type: string, enum: [active, scheduled, expired, lifted] }
      KillswitchListStatus:
        { type: string, enum: [active, scheduled, expired, lifted] }
      KillswitchHistoryAction:
        { type: string, enum: [created, edited, lifted, expired, restored] }
      KillswitchOverlapStatus: { type: string, enum: [active, scheduled] }
      KillswitchConflictName:
        { type: string, enum: [operation_conflict, version_conflict] }
  - target: $.paths["/rpc/killswitches.list"].get.parameters[?@.name=='capability_key'].schema
    remove: true
  - target: $.paths["/rpc/killswitches.list"].get.parameters[?@.name=='capability_key']
    update:
      schema: { $ref: "#/components/schemas/KillswitchCapabilityKey" }
  - target: $.paths["/rpc/killswitches.list"].get.parameters[?@.name=='status'].schema
    remove: true
  - target: $.paths["/rpc/killswitches.list"].get.parameters[?@.name=='status']
    update:
      schema: { $ref: "#/components/schemas/KillswitchListStatus" }
  - target: $.components.schemas.KillswitchCapability.properties.key
    remove: true
  - target: $.components.schemas.KillswitchCapability.properties
    update:
      key: { $ref: "#/components/schemas/KillswitchCapabilityKey" }
  - target: $.components.schemas.KillswitchSummary.properties.capability_key
    remove: true
  - target: $.components.schemas.KillswitchSummary.properties
    update:
      capability_key: { $ref: "#/components/schemas/KillswitchCapabilityKey" }
  - target: $.components.schemas.KillswitchCreateRequest.properties.capability_key
    remove: true
  - target: $.components.schemas.KillswitchCreateRequest.properties
    update:
      capability_key: { $ref: "#/components/schemas/KillswitchCapabilityKey" }
  - target: $.components.schemas.KillswitchPreviewOverlapsRequest.properties.capability_key
    remove: true
  - target: $.components.schemas.KillswitchPreviewOverlapsRequest.properties
    update:
      capability_key: { $ref: "#/components/schemas/KillswitchCapabilityKey" }
  - target: $.components.schemas.KillswitchHistoryEvent.properties.action
    remove: true
  - target: $.components.schemas.KillswitchHistoryEvent.properties
    update:
      action: { $ref: "#/components/schemas/KillswitchHistoryAction" }
  - target: $.components.schemas.KillswitchHistoryEvent.properties.status
    remove: true
  - target: $.components.schemas.KillswitchHistoryEvent.properties
    update:
      status: { $ref: "#/components/schemas/KillswitchStatus" }
  - target: $.components.schemas.KillswitchDetail.properties.capability_key
    remove: true
  - target: $.components.schemas.KillswitchDetail.properties.status
    remove: true
  - target: $.components.schemas.KillswitchDetail.properties
    update:
      capability_key: { $ref: "#/components/schemas/KillswitchCapabilityKey" }
      status: { $ref: "#/components/schemas/KillswitchStatus" }
  - target: $.components.schemas.KillswitchSummary.properties.status
    remove: true
  - target: $.components.schemas.KillswitchSummary.properties
    update:
      status: { $ref: "#/components/schemas/KillswitchStatus" }
  - target: $.components.schemas.KillswitchOverlap.properties.status
    remove: true
  - target: $.components.schemas.KillswitchOverlap.properties
    update:
      status: { $ref: "#/components/schemas/KillswitchOverlapStatus" }
  - target: $.components.schemas.KillswitchConflict.properties.name
    remove: true
  - target: $.components.schemas.KillswitchConflict.properties
    update:
      name: { $ref: "#/components/schemas/KillswitchConflictName" }
  # Goa unions use a {type,value} envelope, so they cannot describe these
  # established flat tagged objects. Refine the SDK source contract here.
  - target: $.components.schemas.KillswitchScope
    remove: true
  - target: $.components.schemas
    update:
      KillswitchScopeAllServersType: { type: string, enum: [all_servers] }
      KillswitchScopeSelectedServersType:
        { type: string, enum: [selected_servers] }
      KillswitchScheduleStartNow: { type: string, enum: [now] }
      KillswitchScheduleStartScheduled: { type: string, enum: [scheduled] }
      KillswitchScheduleEndUntilLifted: { type: string, enum: [until_lifted] }
      KillswitchScheduleEndBounded: { type: string, enum: [bounded] }
      KillswitchScope:
        oneOf:
          - title: KillswitchAllServersScope
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:
                $ref: "#/components/schemas/KillswitchScopeAllServersType"
          - title: KillswitchSelectedServersScope
            type: object
            additionalProperties: false
            required: [type, server_ids]
            properties:
              type:
                $ref: "#/components/schemas/KillswitchScopeSelectedServersType"
              server_ids:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: string
                  format: uuid
  - target: $.components.schemas.KillswitchSchedule
    remove: true
  - target: $.components.schemas
    update:
      KillswitchSchedule:
        oneOf:
          - title: KillswitchNowUntilLiftedSchedule
            type: object
            additionalProperties: false
            required: [start, end]
            properties:
              start: { $ref: "#/components/schemas/KillswitchScheduleStartNow" }
              end:
                {
                  $ref: "#/components/schemas/KillswitchScheduleEndUntilLifted",
                }
          - title: KillswitchNowBoundedSchedule
            type: object
            additionalProperties: false
            required: [start, end, ends_at]
            properties:
              start: { $ref: "#/components/schemas/KillswitchScheduleStartNow" }
              end: { $ref: "#/components/schemas/KillswitchScheduleEndBounded" }
              ends_at: { type: string, format: date-time }
          - title: KillswitchScheduledUntilLiftedSchedule
            type: object
            additionalProperties: false
            required: [start, starts_at, end]
            properties:
              start:
                {
                  $ref: "#/components/schemas/KillswitchScheduleStartScheduled",
                }
              starts_at: { type: string, format: date-time }
              end:
                {
                  $ref: "#/components/schemas/KillswitchScheduleEndUntilLifted",
                }
          - title: KillswitchScheduledBoundedSchedule
            type: object
            additionalProperties: false
            required: [start, starts_at, end, ends_at]
            properties:
              start:
                {
                  $ref: "#/components/schemas/KillswitchScheduleStartScheduled",
                }
              starts_at: { type: string, format: date-time }
              end: { $ref: "#/components/schemas/KillswitchScheduleEndBounded" }
              ends_at: { type: string, format: date-time }
  - target: $.components.schemas.InfoResponseBody.properties.trial['$ref']
    remove: true
  - target: $.components.schemas.InfoResponseBody.properties.trial
    update:
      allOf:
        - $ref: "#/components/schemas/Trial"
      nullable: true
  - target: $.components.schemas.BillingEmail.properties.email
    update:
      nullable: true
  # code_challenge_methods_supported suppresses omitempty in the Go encoding
  # (Meta struct:tag:json in the design) so null ("never captured") stays
  # distinct from [] ("captured; the issuer advertises no methods") on the
  # wire; these mark the same nullability for SDK generation.
  - target: $.components.schemas.RemoteSessionIssuer.properties.code_challenge_methods_supported
    update:
      nullable: true
  - target: $.components.schemas.RemoteSessionIssuerDraft.properties.code_challenge_methods_supported
    update:
      nullable: true
  - target: $.components.schemas.InfoResponseBody.required
    remove: true
  - target: $.components.schemas.InfoResponseBody
    update:
      required:
        - user_id
        - user_email
        - is_admin
        - organization_override
        - active_organization_id
        - organizations
        - gram_account_type
        - has_active_subscription
        - whitelisted
        - trial
  - target: $.paths.*[?(@.operationId=='uploadOpenAPIv3Asset' || @.operationId=='uploadFunctions' || @.operationId=='uploadImage')]
    update:
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
  - target: $.paths.*[?(@.operationId=='approveAllSkillSuggestions')].requestBody
    update:
      required: false
  - target: $.paths..security
    update:
      - {}
  - target: $.paths.*[?count(@.tags[?@=='admin'])>0]
    remove: true
  - target: $.paths[?length(@)==0]
    remove: true
  - target: $.paths[?match(@~, "^/admin.*")]
    remove: true
