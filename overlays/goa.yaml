overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Edits to plug gaps in OpenAPI generated by Goa
  version: 0.0.0
actions:
  - target: $.components.securitySchemes["function_id_header_Gram-Function-ID"]
    remove: true
  - target: $.components.securitySchemes["function_token_header_Gram-Function-Token"]
    remove: true
  - target: $.components.schemas.Error
    update:
      x-speakeasy-name-override: ServiceError
  - target: $.components.schemas.InfoResponseBody.properties.trial['$ref']
    remove: true
  - target: $.components.schemas.InfoResponseBody.properties.trial
    update:
      allOf:
        - $ref: "#/components/schemas/Trial"
      nullable: true
  - target: $.components.schemas.BillingEmail.properties.email
    update:
      nullable: true
  # code_challenge_methods_supported suppresses omitempty in the Go encoding
  # (Meta struct:tag:json in the design) so null ("never captured") stays
  # distinct from [] ("captured; the issuer advertises no methods") on the
  # wire; these mark the same nullability for SDK generation.
  - target: $.components.schemas.RemoteSessionIssuer.properties.code_challenge_methods_supported
    update:
      nullable: true
  - target: $.components.schemas.RemoteSessionIssuerDraft.properties.code_challenge_methods_supported
    update:
      nullable: true
  - target: $.components.schemas.InfoResponseBody.required
    remove: true
  - target: $.components.schemas.InfoResponseBody
    update:
      required:
        - user_id
        - user_email
        - is_admin
        - organization_override
        - active_organization_id
        - organizations
        - gram_account_type
        - has_active_subscription
        - whitelisted
        - trial
  - target: $.paths.*[?(@.operationId=='uploadOpenAPIv3Asset' || @.operationId=='uploadFunctions' || @.operationId=='uploadImage')]
    update:
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
  - target: $.paths.*[?(@.operationId=='approveAllSkillSuggestions')].requestBody
    update:
      required: false
  - target: $.paths..security
    update:
      - {}
  - target: $.paths.*[?count(@.tags[?@=='admin'])>0]
    remove: true
  - target: $.paths[?length(@)==0]
    remove: true
  - target: $.paths[?match(@~, "^/admin.*")]
    remove: true
