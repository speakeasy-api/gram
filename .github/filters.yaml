server:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "agents/**"
  - "ci/**"
  - "server/**"
  - "infra/**"
  # sqlclint is built and tested by `mise run test:ci`, which runs in the
  # server-build-lint job, so its tests only run when this filter matches.
  - "sqlclint/**"
  - ".mise-tasks/test/ci.sh"
  - ".mise-tasks/test/server.sh"

queries:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "sqlclint/**"
  - "sqlclint.yaml"
  - ".sqlclintignore"
  - "server/**/queries.sql"
  - "server/database/schema.sql"
  - ".mise-tasks/lint/queries.sh"

client:
  - ".github/**"
  - "client/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "tsconfig.json"
  - "sdks/typescript/**"

functions:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "functions/**"

cli:
  - "go.mod"
  - "go.sum"
  - "cli/**"
  - "server/design/**"
  - "server/gen/**"

hooks:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "hooks/**"
  - ".mise-tasks/build/hooks.sh"
  - ".mise-tasks/test/hooks.sh"

tsframework:
  - "ts-framework/**"

sdk:
  - "client/dashboard/src/sdk/**"
  - "package.json"
  - "pnpm-lock.yaml"

sdk-gen:
  - ".speakeasy/workflow.yaml"
  - "client/dashboard/src/sdk/.speakeasy/gen.yaml"
  - "hooks/sdk/.speakeasy/gen.yaml"
  - "mise.toml"
  - "overlays/**"
  - "server/gen/http/openapi3.yaml"

migrations:
  - "go.mod"
  - "go.sum"
  - "server/migrations/**"
  - "server/database/schema.sql"
  - "server/clickhouse/migrations/**"
  - "server/clickhouse/local/golang_migrate/**"
  - "server/clickhouse/schema.sql"

database-changes:
  - "server/migrations/**"
  - "server/clickhouse/migrations/**"
  - "server/clickhouse/schema.sql"

db-migrations:
  - "server/migrations/**"
  - "server/clickhouse/migrations/**"

plog:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "plog/**"

infra:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "infra/**"
  - "buf.yaml"
  - "buf.gen.yaml"
  - "uv.lock"
  - "pyproject.toml"
  - ".mise-tasks/lint/infra.sh"
  - ".mise-tasks/test/infra.sh"
  - ".mise-tasks/gen/infra.sh"

pystreams:
  - ".github/**"
  - "uv.lock"
  - "pyproject.toml"
  - "pystreams/**"
  # pystreams depends on the gram-infra workspace member (path dependency), so
  # source edits to its Python modules don't bump uv.lock. Watch them directly:
  # pystreams imports gram_infra.* and the buf-generated gram.* (from gen_py).
  - "infra/gram_infra/**"
  - "infra/gen_py/**"
  - ".mise-tasks/lint/pystreams.sh"
  - ".mise-tasks/test/pystreams.sh"

webhooks-catalog:
  - "server/internal/outbox/events/catalog_gen.yaml"

otel-collector:
  - "otel-collector/**"

# Paths that were moved or retired. PRs must not add or modify files here —
# stale generators, cherry-picks, or muscle memory can silently resurrect a
# directory after it was relocated (e.g. client/sdk lived on for a year after
# the SDK moved to client/dashboard/src/sdk). Enforced by the "Block changes
# to deprecated paths" step in .github/workflows/hygiene.yaml; add an entry
# here whenever a part of the codebase is moved.
# Deletions are allowed so cleanup PRs can still remove stragglers.
deprecated-paths:
  - added|modified: "client/sdk/**"

tunnel:
  - ".github/**"
  - "go.mod"
  - "go.sum"
  - "tunnel/**"
