# Magellan: a nightly agent that explores the production dashboard as a bot
# user in a dedicated integration org, and files the bugs it can prove as
# Linear Triage issues. See e2e/magellan/README.md.
#
# The agent runs inside the agent jail (e2e/agent-jail/README.md): it holds
# no secret, its browser can reach only the site, and it can reach nothing
# else but the Anthropic proxy. The repo is public, so this workflow uploads
# no artifacts and logs no findings: screenshots and detail go to Linear only.
#
# Setup, in the `magellan` environment (restrict it to the main branch):
# - vars:    MAGELLAN_ORG, MAGELLAN_EXTRA_HOSTS (optional: comma-separated
#            hosts the dashboard loads from besides the site itself)
# - secrets: MAGELLAN_SESSION (the bot's `gram_session`), ANTHROPIC_API_KEY,
#            MAGELLAN_LINEAR_API_KEY
name: Magellan

on:
  workflow_dispatch:
    inputs:
      since:
        description: Focus on dashboard changes merged since (git date)
        default: 24 hours ago
      file:
        description: File Linear issues (otherwise dry run)
        type: boolean
        default: true
  schedule:
    # Explore on weeknights, after the day's merges.
    - cron: "0 3 * * 2-6"
    # Keep the bot's session alive. It expires after 72h without use, and
    # the weekend gap alone is about that long.
    - cron: "0 15 * * *"

permissions:
  contents: read

# Every explore run shares one group, so two runs never file at once.
concurrency:
  group: ${{ github.event.schedule == '0 15 * * *' && 'magellan-keepalive' || 'magellan' }}
  cancel-in-progress: false

env:
  # Fixed here, not a variable: the session is only ever sent to this site.
  # explore.sh checks it against the same list.
  MAGELLAN_SITE_URL: https://app.getgram.ai

jobs:
  keepalive:
    name: keepalive
    # The environment's branch rule is the real guard; this makes a run from
    # any other branch fail early and visibly.
    if: github.event.schedule == '0 15 * * *' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: magellan
    timeout-minutes: 5
    steps:
      # Any authenticated call slides the session's 72h expiry. A 401 or 403
      # means the session is gone and someone has to capture a new one.
      - name: Refresh the bot session
        env:
          SESSION: ${{ secrets.MAGELLAN_SESSION }}
        run: |
          status=$(curl --proto '=https' --max-time 30 -s -o /dev/null -w '%{http_code}' \
            -H "Gram-Session: $SESSION" "${MAGELLAN_SITE_URL}/rpc/auth.info" || true)
          if [ "$status" = 401 ] || [ "$status" = 403 ]; then
            echo "::error::The Magellan bot session is no longer valid (auth.info returned $status). Capture a new one; see e2e/magellan/README.md."
            exit 1
          elif [ "$status" != 200 ]; then
            echo "::error::auth.info returned $status. Retry later."
            exit 1
          fi

  explore:
    name: explore
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 2-6')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: magellan
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1
        with:
          fetch-depth: 0
          # No GitHub token left on disk.
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      # Pinned npm releases, integrity-checked, root-owned and read-only.
      - name: Install the agent jail
        run: |
          sudo NODE_BIN="$(mise which node)" e2e/agent-jail/jail.sh install 2.1.311 @playwright/cli@0.1.17
          sudo e2e/agent-jail/jail.sh browsers

      # The proxy lets the browser reach the site (and the listed extra
      # hosts) and nothing else. The Anthropic key goes to the proxy's own
      # user; the agent never holds it.
      - name: Start the agent jail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRA_HOSTS: ${{ vars.MAGELLAN_EXTRA_HOSTS }}
        run: |
          hosts="${MAGELLAN_SITE_URL#https://}"
          # Split on commas into an array: no word splitting or globbing.
          IFS=, read -ra extra <<< "$EXTRA_HOSTS"
          for h in "${extra[@]}"; do
            h="${h// /}"
            [ -n "$h" ] || continue
            [[ "$h" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]] || {
              echo "::error::MAGELLAN_EXTRA_HOSTS has a bad host name"; exit 1; }
            hosts="$hosts,$h"
          done
          JAIL_ALLOWED_HOSTS="$hosts" sudo --preserve-env=ANTHROPIC_API_KEY,JAIL_ALLOWED_HOSTS \
            e2e/agent-jail/jail.sh start

      - name: Explore
        env:
          MAGELLAN_ORG: ${{ vars.MAGELLAN_ORG }}
          MAGELLAN_SESSION: ${{ secrets.MAGELLAN_SESSION }}
          SINCE: ${{ inputs.since || '24 hours ago' }}
        run: mise run magellan:explore --since "$SINCE"

      - name: Stop the agent jail
        if: always()
        run: sudo e2e/agent-jail/jail.sh stop

      # The agent cannot see the checkout (the jail hides /home), so this
      # should never fire. Filing runs repo code with a Linear key, so check
      # anyway, and fail closed if the check itself fails.
      - name: Check the checkout is unchanged
        run: |
          status=$(git status --porcelain) || { echo "::error::Could not verify the checkout; not filing."; exit 1; }
          if [ -n "$status" ]; then
            echo "::error::Tracked files changed during exploring; not filing."
            exit 1
          fi

      - name: File findings
        env:
          LINEAR_API_KEY: ${{ secrets.MAGELLAN_LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILE: ${{ github.event_name == 'schedule' || inputs.file }}
        run: |
          if [ "$FILE" = true ]; then
            mise run magellan:file --file --run-url "$RUN_URL"
          else
            mise run magellan:file --run-url "$RUN_URL"
          fi
