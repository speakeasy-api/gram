name: Set up client tests
description: Install client dependencies, restore suite transforms, and select test coverage
inputs:
  suite:
    description: Client suite (dashboard or admin)
    required: true
outputs:
  cache-prefix:
    description: Suite-specific compatible Vitest cache prefix
    value: ${{ steps.vitest-cache-key.outputs.prefix }}
  cache-hit:
    description: Whether the exact suite cache was restored
    value: ${{ steps.vitest-cache.outputs.cache-hit }}
  test-args:
    description: Optional affected-test arguments (empty means full coverage)
    value: ${{ steps.select.outputs.args }}
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        minimum_release_age: 1d
        install: true
        cache: true
        cache_key_prefix: mise-blacksmith-v1
        env: false

    - name: Prepare GitHub Actions environment
      shell: bash
      run: mise run github

    - name: Cache aube store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ env.GH_CACHE_AUBE_KEY }}
        restore-keys: |
          ${{ env.GH_CACHE_AUBE_KEY }}
          ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
        path: |
          ${{ env.AUBE_STORE_PATH }}

    - name: Install dependencies
      shell: bash
      run: aube install --frozen-lockfile

    # Restore after installation, which can replace node_modules.
    - name: Vitest cache key
      id: vitest-cache-key
      uses: ./.github/workflows/composite/vitest-cache-key # zizmor: ignore[self-repository]
      with:
        suite: ${{ inputs.suite }}

    - name: Restore Vitest module cache
      id: vitest-cache
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vitest-cache
        key: ${{ steps.vitest-cache-key.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.vitest-cache-key.outputs.prefix }}
          ${{ steps.vitest-cache-key.outputs.legacy-prefix }}

    # A pull request run only executes the test files whose module graph
    # reaches a file the pull request changed (vitest --changed). The whole
    # suite still runs when anything outside the two apps' sources changed
    # that the tests could depend on (dependencies, configuration, shared
    # test setup, this workflow), with the ci:full label, and always in the
    # merge queue. A fixture a test reads from disk without importing it is
    # invisible to the module graph; the merge queue is what catches that.
    - name: Select tests
      id: select
      env:
        SELECTIVE: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$SELECTIVE" != "true" ]]; then
          echo "Running every test file."
          exit 0
        fi
        # HEAD is the pull request merge commit; its first parent is the base.
        git fetch --quiet --depth=2 origin "$GITHUB_SHA"
        watched='^(\.github/|client/|e2e/|sdks/typescript/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$)'
        sources='^client/(dashboard|admin)/src/'
        shared='^client/(dashboard|admin)/src/test/'
        forcing=$(git diff --name-only HEAD^1 HEAD | grep -E "$watched" | grep -Ev "$sources" || true)
        forcing+=$(git diff --name-only HEAD^1 HEAD | grep -E "$shared" || true)
        if [[ -n "$forcing" ]]; then
          echo "Running every test file because these changed:"
          head -20 <<< "$forcing"
          exit 0
        fi
        echo "Running only the test files affected by this pull request."
        echo "args=--changed HEAD^1 --passWithNoTests" >> "$GITHUB_OUTPUT"
