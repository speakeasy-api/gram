name: "Go module cache"
description: "Restore the Go module cache saved by the go-module-cache job in pr.yaml. Requires Go on PATH."

# Blacksmith's Go build caching (GOCACHEPROG) covers compiled output, so only
# the module cache is cached here.
#
# Restore only: the go-module-cache job is the single writer. When jobs raced
# to save a shared key, the first one to finish won, and if it never built the
# custom golangci-lint binary the entry lacked the linter's modules, so every
# server-build-lint run downloaded them again until go.sum next changed. An
# exact miss (go.sum changed in this run) falls back to the newest entry and
# downloads the difference.

inputs:
  lookup-only:
    description: "Only check whether the exact entry exists, without downloading it"
    default: "false"

outputs:
  cache-hit:
    description: "Whether the exact entry exists"
    value: ${{ steps.restore.outputs.cache-hit }}
  key:
    description: "Exact cache key, for actions/cache/save"
    value: ${{ steps.restore.outputs.cache-primary-key }}
  path:
    description: "Module cache path, for actions/cache/save"
    value: ${{ steps.path.outputs.path }}

runs:
  using: "composite"
  steps:
    - id: path
      shell: bash
      run: echo "path=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    # .custom-gcl.yml pins the golangci-lint version, whose own dependencies
    # the go-module-cache job downloads, so it busts the key too.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.path.outputs.path }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'glint/go.mod', 'glint/go.sum', 'server/.custom-gcl.yml') }}
        restore-keys: go-mod-${{ runner.os }}-
        lookup-only: ${{ inputs.lookup-only }}
