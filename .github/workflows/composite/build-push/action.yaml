name: "Build and Push image"
description: "Composite action to generate registry images"

inputs:
  hub-username:
    required: true
    description: "Docker Hub username"
  hub-token:
    required: true
    description: "Docker Hub token"
  registry:
    description: "Image registry to use"
    required: true
    default: "gcr.io/linen-analyst-344721"
  username:
    description: "Username to the image registry"
    required: true
  password:
    description: "Password for the image registry"
    required: true
  image:
    description: "Docker image to build"
    required: true
  context:
    description: "Context to docker build"
    required: true
    default: "."
  file:
    description: "Path to the docker file relative to context"
    required: true
  build-args:
    description: "Build arguments for docker (key=value format)"
    required: false
  git-auth-token:
    description: "The GitHub access token for accessing private repos"
    required: true
  cache-key:
    description: "Blacksmith sticky-disk cache key; use one key per image so builds share layers across runs"
    required: true

outputs:
  image-tag:
    description: "Final image tag built and pushed"
    value: ${{ steps.set-tag.outputs.image-tag }}

runs:
  using: "composite"
  steps:
    - name: Setup Docker builder
      # Skip on fork PRs: untrusted code must not commit to the shared sticky
      # disk. The build step below then falls back to the default builder and
      # simply runs uncached.
      if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
      uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
      with:
        cache-key: ${{ inputs.cache-key }}

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.hub-username }}
        password: ${{ inputs.hub-token }}

    - name: Generate preview tag
      id: preview-tag
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-8)
          echo "tag=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "enabled=true" >> $GITHUB_OUTPUT
        else
          echo "tag=" >> $GITHUB_OUTPUT
          echo "enabled=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image }}
        tags: |
          type=ref,event=branch,enable=${{ github.event_name != 'merge_group' }}
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ steps.preview-tag.outputs.tag }},enable=${{ steps.preview-tag.outputs.enabled }}
          type=schedule,pattern=nightly
          type=sha
          type=sha,format=long

    - name: Validate and sanitize build arguments
      shell: bash
      env:
        ARGS: ${{ inputs.build-args }}
      run: |
        set -e

        # Comprehensive validation
        echo "Validating build arguments..."

        # Check for empty input
        if [[ -z "$ARGS" ]]; then
          echo "No build arguments provided"
          exit 0
        fi

        # Define security patterns to reject
        DANGEROUS_PATTERNS=(
          '\$\('          # Command substitution
          '`'             # Backticks  
          '\|\|'          # OR operator
          '&&'            # AND operator
          ';'             # Command separator
          '&'             # Background execution
          '>'             # Redirection
          '<'             # Input redirection
          'curl'          # HTTP client
          'wget'          # HTTP client
          'nc\|netcat'    # Network tools
          'bash'          # Shell execution
          'sh '           # Shell execution
          '/bin/'         # Binary execution
          'eval'          # Code evaluation
          'exec'          # Command execution
        )

        # Check each line
        while IFS= read -r line; do
          if [[ -n "$line" ]]; then
            # Check for dangerous patterns
            for pattern in "${DANGEROUS_PATTERNS[@]}"; do
              if echo "$line" | grep -qiE "$pattern"; then
                echo "Dangerous pattern detected: $pattern"
                echo "Line: $line"
                exit 1
              fi
            done
            
            # Validate key=value format
            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=[A-Za-z0-9._/-]+$ ]]; then
              echo "Invalid format: $line"
              echo "Must be: KEY=value (alphanumeric only)"
              exit 1
            fi
          fi
        done <<< "$ARGS"

        echo "Build arguments validated successfully"

    - name: Set GIT_SHA
      shell: bash
      run: echo "GIT_SHA=$(echo $GITHUB_SHA)" >> $GITHUB_ENV

    - name: Build and push registry Docker image
      # Blacksmith fork of docker/build-push-action, paired with the
      # setup-docker-builder step above: buildkit state lives on a sticky disk
      # keyed by inputs.cache-key, so layers persist across runs without the
      # registry cache round-trip.
      uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ${{ inputs.build-args }}
          GIT_SHA=${{ env.GIT_SHA }}
        secrets: |
          git_auth_token=${{ inputs.git-auth-token }}

    - name: Set output image tag
      id: set-tag
      shell: bash
      run: |
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
        echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
