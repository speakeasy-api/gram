name: GRW-468 full-suite comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: Full dashboard suite before and after
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Checkout optimized revision and its parent
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f
        with:
          ref: 6e4fea31b6a12e9dfaccf8e504326546c3a34b69
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false
      - name: Prepare dependency cache keys
        run: mise run github
      - name: Restore aube store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ env.GH_CACHE_AUBE_KEY }}
          restore-keys: ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
          path: ${{ env.AUBE_STORE_PATH }}
      - name: Install identical dependencies once
        run: aube install --frozen-lockfile
      - name: Full dashboard suite - before
        run: |
          git checkout --force --detach 0aae37a1b459a7b5697286fe29c4eafa5b3c23ff
          cd client/dashboard
          /usr/bin/time -p aube exec vitest -- run --maxWorkers=4 --fsModuleCache=false --cache=false --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/grw468-before.json"
      - name: Full dashboard suite - after
        run: |
          git checkout --force --detach 6e4fea31b6a12e9dfaccf8e504326546c3a34b69
          cd client/dashboard
          /usr/bin/time -p aube exec vitest -- run --maxWorkers=4 --fsModuleCache=false --cache=false --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/grw468-after.json"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grw468-full-suite-comparison
          path: |
            ${{ runner.temp }}/grw468-before.json
            ${{ runner.temp }}/grw468-after.json
          retention-days: 7
          if-no-files-found: warn
