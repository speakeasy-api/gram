name: GRW-470 page splitting full admin benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: Full admin before and after on one runner
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NODE_DISABLE_COMPILE_CACHE: '1'
      BEFORE_SHA: 5468d0b2690fe7e7ad3b73a62b5a0cc2aa0ba78b
      AFTER_SHA: 2a500bb8320b34c65213650f72354a9cf1659d24
    steps:
      - name: Checkout optimized revision and its parent
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f
        with:
          ref: 2a500bb8320b34c65213650f72354a9cf1659d24
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false
      - name: Prepare dependency cache keys
        run: mise run github
      - name: Restore aube store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ env.GH_CACHE_AUBE_KEY }}
          restore-keys: ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
          path: ${{ env.AUBE_STORE_PATH }}
      - name: Install identical dependencies once
        run: aube install --frozen-lockfile
      - name: Full admin before-after-after-before
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'grw470-results'
          out.mkdir(exist_ok=True)
          before = os.environ['BEFORE_SHA']; after = os.environ['AFTER_SHA']
          metadata = {'before':before, 'after':after, 'workers':3, 'fsModuleCache':False, 'resultsCache':False, 'NODE_DISABLE_COMPILE_CACHE':os.environ.get('NODE_DISABLE_COMPILE_CACHE'), 'order':['before','after','after','before'], 'node':subprocess.check_output(['node','--version'],text=True).strip(), 'affinity':sorted(os.sched_getaffinity(0))}
          (out/'metadata.json').write_text(json.dumps(metadata,indent=2))
          results=[]
          for index, variant in enumerate(metadata['order'],1):
              revision = before if variant == 'before' else after
              subprocess.run(['git','checkout','--detach',revision],check=True)
              label=f'{index}-{variant}'
              cmd=['/usr/bin/time','-v','-o',str(out/f'{label}-resources.txt'),'aube','exec','vitest','--','run','--maxWorkers=3','--fsModuleCache=false','--cache=false','--reporter=default','--reporter=json',f'--outputFile.json={out}/{label}.json']
              started=time.monotonic()
              with (out/f'{label}.log').open('w') as log:
                  r=subprocess.run(cmd,cwd='client/admin',stdout=log,stderr=subprocess.STDOUT)
              row={'label':label,'revision':revision,'wall_seconds':round(time.monotonic()-started,3),'exit_code':r.returncode}
              results.append(row);print(json.dumps(row),flush=True)
              (out/'results.json').write_text(json.dumps(results,indent=2))
              print((out/f'{label}.log').read_text()[-1800:],flush=True)
              if r.returncode:raise SystemExit(r.returncode)
          PY
      - name: Upload matched benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grw470-matched-admin
          path: ${{ runner.temp }}/grw470-results/
          retention-days: 14
          if-no-files-found: error
