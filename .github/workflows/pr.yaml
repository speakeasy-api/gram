  docker-build-client:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    # Build the dashboard and admin docker images when server OR client changes
    # exist (the dashboard image is needed for preview environments)
    if: |
      !cancelled() &&
      (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true')
    env:
      GRAM_GIT_SHA: "${{ github.sha }}"
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Prepare GitHub Actions environment
        run: mise run github

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_AUBE_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_AUBE_KEY }}
            ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
          path: |
            ${{ env.AUBE_STORE_PATH }}

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Build
        env:
          NODE_ENV: production
        run: mise exec --env viteprod -- aube run build

      # Published for upload-dashboard-assets so the CDN bucket receives the
      # exact assets this image ships with (a rebuild there could hash
      # differently, e.g. GRAM_GIT_SHA is only set in this job).
      - name: Upload built assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-assets
          path: client/dashboard/dist/assets
          retention-days: 2

      - name: Upload source maps to DataDog
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: mise run datadog:sourcemaps --git-sha "${{ github.sha }}"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/409661704476/locations/global/workloadIdentityPools/ga-pool/providers/github-oidc-provider"
          service_account: "speakeasy-registry-ga-ci@linen-analyst-344721.iam.gserviceaccount.com"
      - name: Login to GCR
        env:
          GCR_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          max_attempts=3
          for ((i=1; i<=max_attempts; i++)); do
            echo "Docker login attempt $i/$max_attempts..."
            if docker login -u oauth2accesstoken --password-stdin gcr.io/linen-analyst-344721 <<< "$GCR_TOKEN"; then
              echo "Login successful"
              exit 0
            fi
            if [ $i -lt $max_attempts ]; then
              echo "Login failed, waiting 5s before retry..."
              sleep 5
            fi
          done
          echo "All login attempts failed"
          exit 1
      # The Gram admin dashboard. It ships as its own image because it is
      # served from the admin origin (same host as the admin API) rather than
      # the app origin. The `pnpm build` step above already produced its dist,
      # so this only packages it; it needs no CDN asset upload.
      # The image name must stay in step with adminDashboard.repository in the
      # deployment Helm chart. "gram-admin" would be ambiguous: the admin API
      # itself runs from the main "gram" image, not from an image of its own.
      # Keep this ahead of the dashboard image push. A failure here fails the
      # job, which skips upload-dashboard-assets; if the dashboard image were
      # already pushed it would reference hashed assets that never reached the
      # CDN bucket.
      - name: Build and Push Admin Dashboard image to GCR
        id: build-admin-dashboard
        uses: ./.github/workflows/composite/build-push
        with:
          hub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          hub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          image: ${{ env.DOCKER_REPOSITORY_OWNER }}/gram-admin-dashboard
          context: ./client/admin
          file: client/admin/Dockerfile
          git-auth-token: ${{ secrets.BOT_REPO_TOKEN }}
          cache-key: gram/admin-dashboard-image

      - name: Build and Push Registry image to GCR
        id: build
        uses: ./.github/workflows/composite/build-push
        with:
          hub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          hub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          image: ${{ env.DOCKER_REPOSITORY_OWNER }}/gram-dashboard
          context: ./client/dashboard
          file: client/dashboard/Dockerfile
          git-auth-token: ${{ secrets.BOT_REPO_TOKEN }}
          cache-key: gram/dashboard-image

      - name: Prune aube store
        if: success()
        run: aube store prune

  upload-dashboard-assets:
    name: Upload dashboard assets to CDN bucket (${{ matrix.environment }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [docker-build-client]
    # Syncs the dist/assets the dashboard image was built from (via artifact,
    # not a rebuild) into the private GCS buckets that will become the CDN
    # origins (gram-infra: infra/terraform/k8s/cdn-bucket.tf). Runs on PRs too
    # so preview images' hashed assets are already in the buckets before any
    # deploy references them. Forks and dependabot are skipped: their runs
    # cannot mint the OIDC token needed for workload identity auth.
    if: |
      !cancelled() &&
      needs.docker-build-client.result == 'success' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            bucket_secret: ASSET_BUCKET_DEV
            workload_identity_provider_secret: GCP_WORKLOAD_IDENTITY_PROVIDER_DEV
            service_account_secret: ASSET_BUCKET_SERVICE_ACCOUNT_DEV
          - environment: prod
            bucket_secret: ASSET_BUCKET_PROD
            workload_identity_provider_secret: GCP_WORKLOAD_IDENTITY_PROVIDER_PROD
            service_account_secret: ASSET_BUCKET_SERVICE_ACCOUNT_PROD
    steps:
      - name: Download built assets artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-assets
          path: dist/assets

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets[matrix.workload_identity_provider_secret] }}
          service_account: ${{ secrets[matrix.service_account_secret] }}

      - name: Upload assets to bucket
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: dist/assets
          destination: ${{ secrets[matrix.bucket_secret] }}/assets
          parent: false
          # Resumable sessions flake under high concurrency ("offset is lower
          # than the number of bytes written"); these files are small enough
          # that simple uploads with client retries are safer.
          resumable: false
          # The CDN compresses at the edge (compression_mode AUTOMATIC) and
          # skips responses that are already content-encoded, so objects must
          # be stored uncompressed.
          gzip: false
          process_gcloudignore: false
          # Filenames are content-hashed, so they are safe to cache forever.
          headers: |-
            cache-control: public, max-age=31536000, immutable

