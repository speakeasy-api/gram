        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_GO_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_GO_KEY }}
            ${{ env.GH_CACHE_GO_KEY_PARTIAL }}
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_AUBE_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_AUBE_KEY }}
            ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
          path: |
            ${{ env.AUBE_STORE_PATH }}

      - name: Install Go tools
        run: go install tool

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Test functions runner
        working-directory: functions
        run: mise run test:functions

      - name: Test functions entrypoint
        working-directory: functions
        run: aube run test

      - name: Type check functions entrypoint
        working-directory: functions
        run: aube run type-check

      - name: Lint Go server
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          # Skips a JSONSchema fetch from golangci-lint.run on every run.
          verify: false
          working-directory: functions

      - name: Test Go server
        run: mise run test:functions

      - name: Build Gram Functions host
        env:
          MELANGE_PRIVATE_KEY: ${{ secrets.MELANGE_PRIVATE_KEY }}
        run: |
          KEY_DIR=$(mktemp -d)
          KEY_FILE="$KEY_DIR/melange-signing-key.rsa"
          echo "$MELANGE_PRIVATE_KEY" > "$KEY_FILE"
          mise run build:functions-bin --melange-private-key "$KEY_FILE"
          rm -rf "$KEY_DIR"

      - name: Upload melange packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functions-packages
          path: functions/packages
          retention-days: 2

      - name: Run "go mod tidy"
        run: mise run go:tidy

      - name: Check for dirty files
        run: mise run git:porcelain

      - name: Prune aube store
        if: success()
        run: aube store prune

  functions-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes, functions-build-host]
    if: needs.changes.outputs.functions == 'true'
    strategy:
      matrix:
        include:
          - runtime: nodejs22
            apko-config: ./images/nodejs22-alpine3.22.yaml
          - runtime: nodejs24
            apko-config: ./images/nodejs24-alpine3.23.yaml
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Prepare GitHub Actions environment
        run: mise run github

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_AUBE_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_AUBE_KEY }}
            ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
          path: |
            ${{ env.AUBE_STORE_PATH }}

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Download melange packages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: functions-packages
          path: functions/packages

      - name: Build apko image (${{ matrix.runtime }})
        id: apko
        env:
          MELANGE_PUBLIC_KEY: ${{ vars.MELANGE_PUBLIC_KEY }}
        run: |
          KEY_DIR=$(mktemp -d)
          KEY_FILE="$KEY_DIR/melange-signing-key.rsa.pub"
          echo "$MELANGE_PUBLIC_KEY" > "$KEY_FILE"

          mise run build:functions-image \
            --melange-public-key "$KEY_FILE" \
            --apko-config ${{ matrix.apko-config }} \
            --image "apko-${{ matrix.runtime }}:${{ github.sha }}" \
            --tarball-name ${{ matrix.runtime }} \
            --out oci/${{ matrix.runtime }}

      - name: Run safety checks
        run: |
          mise run test:apko-functions \
            --image ${{ steps.apko.outputs.image }} \
            --tarball ${{ steps.apko.outputs.tarball }}

      - name: "[DEV] Create fly app"
        id: flyCreateDev
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
          FLY_IMAGE: ${{ vars.FLY_IMAGE_DEV }}
        run: |
          mise run fly:init-runner \
            --org ${{ secrets.FLY_ORG_DEV }} \
            --image $FLY_IMAGE \
            --force

      - name: "[PROD] Create fly app"
        id: flyCreateProd
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
          FLY_IMAGE: ${{ vars.FLY_IMAGE_PROD }}
        run: |
          mise run fly:init-runner \
            --org ${{ secrets.FLY_ORG_PROD }} \
            --image $FLY_IMAGE \
            --force

      - name: Set up Docker Buildx
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.flyCreateDev.outputs.flyAppRegistry }}
            ${{ steps.flyCreateProd.outputs.flyAppRegistry }}
          tags: |
            type=ref,event=branch,prefix=,suffix=-${{ matrix.runtime }},enable=${{ github.event_name != 'merge_group' }}
            type=ref,event=tag,prefix=,suffix=-${{ matrix.runtime }}
            type=schedule,pattern=nightly,prefix=,suffix=-${{ matrix.runtime }}
            type=sha,prefix=,suffix=-${{ matrix.runtime }}
            type=sha,format=long,prefix=,suffix=-${{ matrix.runtime }}

      - name: Tag images
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: functions
        run: |
          set -x

          echo "Loading image from tarball: ${{ steps.apko.outputs.tarball }}"
          docker image load -i ${{ steps.apko.outputs.tarball }}

          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            docker tag "${{ steps.apko.outputs.image }}-amd64" "$TAG"
          done

      - name: "[DEV] Push images"
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
        run: |
          set -x
          fly auth docker
          docker push --all-tags "${{ steps.flyCreateDev.outputs.flyAppRegistry }}"

      - name: "[PROD] Push images"
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
        run: |
          set -x
          fly auth docker
          docker push --all-tags "${{ steps.flyCreateProd.outputs.flyAppRegistry }}"

      - name: Prune aube store
        if: success()
        run: aube store prune

  ts-framework-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.tsframework == 'true'
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Prepare GitHub Actions environment
        run: mise run github

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_AUBE_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_AUBE_KEY }}
            ${{ env.GH_CACHE_AUBE_KEY_PARTIAL }}
          path: |
            ${{ env.AUBE_STORE_PATH }}

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Test TypeScript framework
        run: aube run --filter "./ts-framework/**" --if-present test

      - name: Build TypeScript framework
        run: aube run --filter "./ts-framework/**" --if-present build

      - name: Prune aube store
        if: success()
        run: aube store prune

  # Scans the frontend for UI anti-patterns and "AI slop" tells (side-tab accent
  # borders, gradient headings, bounce easing, AI-favourite color palettes, ...)
  # using https://npmjs.com/package/impeccable.
  #
  # The tree is clean as of this check's introduction, so the whole frontend is
  # scanned rather than just the PR diff — a full scan takes ~3 seconds and also
  # catches regressions in files the PR did not touch. It is deliberately not
  # path-filtered for the same reason.
  #
  # Rule waivers live in .impeccable/config.json (see `impeccable ignores --help`)
  # or as inline `impeccable-disable-next-line <rule>` comments.
  impeccable:
    name: Detect UI anti-patterns
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The scan itself takes ~3s; this only guards against a hung npx install.
    timeout-minutes: 5
    env:
      # Pin the CLI so a new release cannot turn a green PR red without a commit.
      IMPECCABLE_VERSION: "3.4.0"
      # puppeteer is an optional dependency only used for scanning live URLs. We
      # scan files, so skip the ~150MB Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout source code
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          # This job only needs npx; avoid restoring the full ~606 MiB toolchain
          # into a job with a five-minute timeout.
          install_args: node
          cache_key_prefix: mise-node-blacksmith-v1
          env: false

      - name: Run impeccable
        shell: bash
        run: |
          set -uo pipefail

          # `detect` exits 0 when clean and 2 when anti-patterns are found.
          # GitHub runs this step with `-e`, so the non-zero exit has to be
          # caught inline — otherwise the step aborts here and the findings are
          # never summarised.
          status=0
          npx --yes "impeccable@${IMPECCABLE_VERSION}" detect --json \
            client ts-framework functions > findings.json || status=$?

          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::impeccable exited with unexpected status $status"
            cat findings.json || true
            exit "$status"
          fi

          node .github/scripts/impeccable-summary.mjs findings.json

  # Gate job: aggregates all check results into a single required status check.
  # This allows domain-specific jobs to skip (via job-level `if`) without blocking
  # merge, since skipped jobs don't report a status to rulesets.
  ci-gate:
    name: CI Gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - changes
      - format-check
      - server-build-lint
      - server-test
      - demo-seed-safety
      - docker-build-server
      - docker-build-client
      - upload-dashboard-assets
      - docker-build-pystreams
      - client-build-lint
      - client-test
      - sdk-gen-check
      - cli-build-lint
      - hooks-build-test
      - plog-build-lint
      - infra-build-lint
      - pystreams-build-lint
      - functions-build-host
      - functions-image
      - assistant-runtime-image
      - otel-collector
      - ts-framework-test
      - impeccable
      - golang-migrate-clickhouse
      - lint-migrations
      - atlas-lint
      - atlas-push
      - webhooks-catalog-breaking-changes
      - tunnel-agent
      - svix-sync-webhooks
    steps:
      - name: Check results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_output=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "❌ \(.key) (\(.value.result))"') || { echo "Error: jq command failed"; exit 1; }
          failed=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && failed+=("$line")
          done <<< "$failed_output"

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "CI failed. The following checks did not pass:"
            for item in "${failed[@]}"; do
              echo "  $item"
            done
            exit 1
          fi

          echo "✅ All CI checks passed or were skipped."

  svix-sync-webhooks:
    name: Sync webhook event types to Svix
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [server-build-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SVIX_OPENAPI_FILE: server/internal/outbox/events/catalog_gen.yaml
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1
      - name: Upload event types to Svix (dev)
        uses: svix/svix-event-type-import-action@4e3a9d81b05db38e57187434b6b291e1fef50250 # v1.2.0
        with:
          openapi-file: ${{ env.SVIX_OPENAPI_FILE }}
          svix-api-key: ${{ secrets.SVIX_SYNC_KEY_US_DEV }}
          replace-all: true
      - name: Upload event types to Svix (prod)
        uses: svix/svix-event-type-import-action@4e3a9d81b05db38e57187434b6b291e1fef50250 # v1.2.0
        with:
          openapi-file: ${{ env.SVIX_OPENAPI_FILE }}
          svix-api-key: ${{ secrets.SVIX_SYNC_KEY_US_PROD }}
          replace-all: true

  dispatch-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      [
        ci-gate,
        docker-build-server,
        assistant-runtime-image,
        svix-sync-webhooks,
      ]
    # ci-gate's transitive needs include path-filtered jobs, and a skipped job
    # anywhere in the needs chain skips dependents under the default success()
    # condition even when every direct need succeeded. !cancelled() opts out of
    # that propagation, so each need's result must be checked explicitly: ci-gate
    # green gates the release, and the image/sync jobs succeeding (not skipped)
    # keeps docs-only pushes from dispatching one.
    if: >-
      !cancelled() &&
      needs.ci-gate.result == 'success' &&
      needs.docker-build-server.result == 'success' &&
      needs.assistant-runtime-image.result == 'success' &&
      needs.svix-sync-webhooks.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GRAM_BOT_APP_ID }}
          private-key: ${{ secrets.GRAM_BOT_PRIVATE_KEY }}
          owner: speakeasy-api
          repositories: gram-infra
      - name: Dispatch prepare-release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh workflow run "Prepare Release" \
            -R speakeasy-api/gram-infra \
            -f environment=dev \
            -f commit_hash=${{ github.sha }}

  tunnel-agent:
    name: Tunnel agent
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.tunnel == 'true'
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1
      - name: Setup Docker builder
        # Skip on fork PRs: untrusted code must not commit to the shared sticky
        # disk. The build step below then falls back to the default builder and
        # simply runs uncached.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
        with:
          cache-key: gram/tunnel-agent-image
      - name: Build image (no push)
        # Blacksmith fork of docker/build-push-action, paired with the
        # setup-docker-builder step above: the go build/mod cache mounts in
        # tunnel/Dockerfile persist on the sticky disk across runs.
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: tunnel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=0.0.0-pr
