  server-test:
    name: server-test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      # Every shard should report, otherwise a single failure hides the state of
      # the rest of the suite.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOMAXPROCS: 8
      # The runner VM is destroyed after the job, and the reaper is the one
      # container that would still publish a host port (a recurring source of
      # "address already in use" container-start flakes).
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Prepare GitHub Actions environment
        run: mise run github

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_GO_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_GO_KEY }}
            ${{ env.GH_CACHE_GO_KEY_PARTIAL }}
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}

      - name: Install Go deps
        run: mise run install:go

      - name: Test
        # --rerun-fails=1 gives a failing test one more attempt before the
        # shard is marked failed, so a flaky test does not block the PR.
        run: mise run test:server --shard=${{ matrix.shard }}/${{ strategy.job-total }} --rerun-fails=1

      # A retried test leaves the check green, so without this a flake is
      # invisible unless someone reads the raw log.
      - name: Report retried tests
        if: always()
        working-directory: server
        run: |
          [ -s rerun-report.txt ] || exit 0
          {
            echo "### Retried tests (shard ${{ matrix.shard }})"
            echo
            echo '```'
            cat rerun-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

