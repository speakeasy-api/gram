name: Public OAS Update

"on":
  push:
    branches:
      - main
    paths:
      - server/gen/http/openapi3.yaml
  workflow_dispatch: {}

# A queued run is replaced by a newer one, which regenerates from a later main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  speakeasy-update-public-spec:
    name: speakeasy-update-public-spec
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Install Speakeasy CLI
        run: curl -fsSL https://go.speakeasy.com/cli-install.sh | sh

      - name: Run Speakeasy
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: speakeasy run -s Gram-Public

      - name: Promote
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: speakeasy tag promote --sources=Gram-Public --tags=main
