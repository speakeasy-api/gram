name: Setup corpus freshness

# The Platform MCP setup guides are pinned from mcp-setup-docs, and each one
# carries a 90-day revalidation window from when its provider docs were last
# observed. Whether the pinned export is still inside that window depends on
# the date, not on any pull request, so the check is build-tagged
# (setupcorpus_freshness) out of the sharded server-test job and runs here on a
# schedule. A failure names the expired guide: review it upstream in
# mcp-setup-docs and bump the pinned go/vX.Y.Z module version.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness:
    name: freshness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Restore Go module cache
        uses: ./.github/workflows/composite/go-mod-cache # zizmor: ignore[self-repository]

      - name: Install Go deps
        run: mise run install:go

      - name: Test
        run: mise run test:server -count=1 -tags=setupcorpus_freshness -run TestPinnedCorpusIsWithinItsRevalidationWindow ./internal/platformmcp/setupcorpus/
