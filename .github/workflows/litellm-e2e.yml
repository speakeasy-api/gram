name: LiteLLM real proxy E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  litellm-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Prepare GitHub Actions environment
        run: mise run github

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_GO_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_GO_KEY }}
            ${{ env.GH_CACHE_GO_KEY_PARTIAL }}
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}

      - name: Install Go dependencies
        run: mise run install:go

      - name: Test
        run: mise run test:litellm-e2e
