name: LiteLLM real proxy E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  litellm-e2e:
    name: litellm-e2e
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Restore Go module cache
        uses: ./.github/workflows/composite/go-mod-cache # zizmor: ignore[self-repository]

      - name: Install Go dependencies
        run: mise run install:go

      - name: Test
        run: mise run test:litellm-e2e
