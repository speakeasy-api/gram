name: Code runner
# Runs the gateway's Code Mode integration tests against the runtime release
# pinned in mise.toml. The runtime itself is built, tested and released in
# speakeasy-api/codemode; nothing is compiled from Rust here.
on:
  pull_request:
    paths:
      - "server/internal/codemode/**"
      - "server/internal/sandbox/**"
      - "server/cmd/gram/code_runtime*.go"
      - "server/internal/mcp/serve_meta*.go"
      - "server/internal/mcp/toolselection.go"
      - "server/internal/mcp/metamcp/**"
      - "server/internal/metamcp/**"
      - "server/internal/testenv/code_runner.go"
      - ".mise-tasks/test/code-mode.sh"
      - ".github/workflows/code-runner.yaml"
      - "mise.toml"
      - "mise.lock"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - "server/internal/codemode/**"
      - "server/internal/sandbox/**"
      - "server/cmd/gram/code_runtime*.go"
      - "server/internal/mcp/serve_meta*.go"
      - "server/internal/mcp/toolselection.go"
      - "server/internal/mcp/metamcp/**"
      - "server/internal/metamcp/**"
      - "server/internal/testenv/code_runner.go"
      - ".mise-tasks/test/code-mode.sh"
      - ".github/workflows/code-runner.yaml"
      - "mise.toml"
      - "mise.lock"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches are ref-scoped; this workflow only tests, never publishes artifacts.
      # mise installs the pinned runtime release along with the Go toolchain.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0 # zizmor: ignore[cache-poisoning]
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          env: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_MOD_CACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The Go cache is ~2.3 GB, and the repository's Actions cache is capped
      # at 10 GB, so only main saves, at most once a week per dependency set;
      # pull requests restore.
      - name: Restore Go integration build
        id: go-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ${{ env.GO_BUILD_CACHE }}
            ${{ env.GO_MOD_CACHE }}
          key: code-mode-go-github-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}-${{ steps.go-cache.outputs.week }}
          restore-keys: |
            code-mode-go-github-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}-
            code-mode-go-github-v2-${{ runner.os }}-${{ runner.arch }}-
      # Go cannot track changes to the external runtime executables. Reuse
      # compiled packages, but always execute the integration tests.
      - run: mise run test:code-mode -count=1
      - name: Save Go integration build
        if: github.event_name == 'push' && steps.go-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GO_BUILD_CACHE }}
            ${{ env.GO_MOD_CACHE }}
          key: ${{ steps.go-restore.outputs.cache-primary-key }}
