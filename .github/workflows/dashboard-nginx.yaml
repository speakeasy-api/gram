name: Dashboard NGINX tests

on:
  pull_request:
    paths:
      - client/dashboard/nginx.conf
      - client/dashboard/Dockerfile
      - client/admin/nginx.conf
      - client/admin/Dockerfile
      - client/test_nginx_logging.py
      - .github/workflows/dashboard-nginx.yaml
  push:
    branches: [main]
    paths:
      - client/dashboard/nginx.conf
      - client/dashboard/Dockerfile
      - client/admin/nginx.conf
      - client/admin/Dockerfile
      - client/test_nginx_logging.py
      - .github/workflows/dashboard-nginx.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx-logging:
    name: Verify dashboard NGINX access logs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify probe suppression and preserved access logs
        run: python3 client/test_nginx_logging.py
