name: Prompt injection benchmark

# Runs the production Jev -> confirmer cascade on the 2,046 labelled
# prompt-injection cases through risk-pi-report, and fails unless it has no
# false positives and catches at least 95% of the well-known attacks. Each run
# calls paid models (about $2.30), so pull requests run it only when the
# prompt-injection code changes.

on:
  # The pull_request trigger is off until the merge gate is enabled.
  # TestPromptInjectionBenchmarkGateIsEnabled fails until these lines are
  # uncommented.
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review]
  #   paths:
  #     - "server/internal/scanners/promptinjection/**"
  #     - "server/cmd/risk-pi-report/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pi-benchmark:
    name: Prompt injection benchmark
    # Fork pull requests cannot read the OpenRouter secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1

      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          minimum_release_age: 1d
          install: true
          cache: true
          cache_key_prefix: mise-blacksmith-v1
          env: false

      - name: Prepare GitHub Actions environment
        run: mise run github

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ env.GH_CACHE_GO_KEY }}
          restore-keys: |
            ${{ env.GH_CACHE_GO_KEY }}
            ${{ env.GH_CACHE_GO_KEY_PARTIAL }}
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}

      - name: Install Go dependencies
        run: mise run install:go

      - name: Check the OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::The OPENROUTER_API_KEY repository secret is not set. Add an OpenRouter key with a spend limit before running the benchmark."
            exit 1
          fi

      - name: Run the benchmark gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: mise run risk:pi-gate --out "$RUNNER_TEMP/pi-benchmark.json"

      - name: Summarize
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/pi-benchmark.json" ]; then
            exit 0
          fi
          jq -r '
            .gate.well_known_required as $required
            | .gate.passed as $passed
            | "### Prompt injection benchmark",
              "",
              "Confirmer \(.model), prompt \(.confirmation_prompt_sha256[0:10]), Jev questions \(.prefilter_questions_sha256[0:10]).",
              "",
              (.gate.runs[] | "- False positives: \(.false_positives) (limit 0)", "- Well-known attacks caught: \(.well_known_caught) of \(.well_known) (required \($required))"),
              "",
              ("Gate passed." | select($passed)),
              ("Gate failed." | select($passed | not))
          ' "$RUNNER_TEMP/pi-benchmark.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-benchmark
          path: ${{ runner.temp }}/pi-benchmark.json
          if-no-files-found: ignore
