name: "CLA Assistant"
# Both triggers run with this repository's token: pull_request_target so the
# bot can comment on and set statuses for PRs from forks, and issue_comment so
# a contributor's signing comment is recorded. That is safe here because no
# step checks out or runs PR code: the only step is the CLA action, which
# reads PR metadata through the API, and it runs only for pull_request_target
# events and the two exact comment bodies in its `if:`.
# No concurrency group: every PR comment triggers this workflow, and GitHub
# replaces a group's pending run with the next one, so an unrelated comment
# could drop a queued signature.
on: # zizmor: ignore[dangerous-triggers,concurrency-limits]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    name: CLAAssistant
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: write # the action re-runs this workflow after a signature
      contents: write # commits signatures to the cla-signatures branch
      pull-requests: write # comments on and locks pull requests
      statuses: write # sets the CLA commit status
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Archived upstream with no maintained successor; it is SHA-pinned, so
        # it cannot change under us. Replace it if we move CLA tooling.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 # zizmor: ignore[archived-uses]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the below token should have repo scope and must be manually added by you in the repository's secret
          # This token is used for sending notification to CLA management team and for PR locking
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/speakeasy-api/gram/blob/main/CLA.md" # e.g. a CLA or a DCO document
          # branch should not be protected
          branch: "cla-signatures"
          allowlist: speakeasy-api/*,dependabot[bot],renovate[bot],gram-bot[bot],cubic-dev-ai[bot],cursoragent,claude,linear-code,linear-code[bot]

          # the followings are the optional inputs - If the optional inputs are not given, then default values will be taken
          #remote-organization-name: enter the remote organization name where the signatures should be stored (Default is storing the signatures in the same repository)
          #remote-repository-name: enter the remote repository name where the signatures should be stored (Default is storing the signatures in the same repository)
          #create-file-commit-message: 'For example: Creating file for storing CLA Signatures'
          #signed-commit-message: 'For example: $contributorName has signed the CLA in $owner/$repo#$pullRequestNo'
          #custom-notsigned-prcomment: 'pull request comment with Introductory message to ask new contributors to sign'
          #custom-pr-sign-comment: 'The signature to be committed in order to sign the CLA'
          #custom-allsigned-prcomment: 'pull request comment when all contributors has signed, defaults to **CLA Assistant Lite bot** All Contributors have signed the CLA.'
          #lock-pullrequest-aftermerge: false - if you don't want this bot to lock the pull request after merging (default - true)
          #use-dco-flag: true - If you are using DCO instead of CLA
