name: Dependabot lockfile normalization

# Keep pull_request so normalization does not run with Actions secrets.
# Install a dedicated App on gram only: Contents write, no ruleset bypass.
# Set DEPENDABOT_NORMALIZER_CLIENT_ID and DEPENDABOT_NORMALIZER_PRIVATE_KEY
# as repository Dependabot secrets. Do not reuse gram-bot.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "**/package.json"
      - pnpm-workspace.yaml
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: dependabot-normalization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize the lockfile
    outputs:
      changed: ${{ steps.normalize.outputs.changed }}
    # Ignore the writer’s own push.
    if: >-
      github.event.sender.id == 49699333 &&
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read # Verify Dependabot PR metadata.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files before running repository tooling
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          helper="$RUNNER_TEMP/normalize-dependabot.mjs"
          git show "$BASE_SHA:.github/scripts/normalize-dependabot.mjs" > "$helper"
          node "$helper" scope "$BASE_SHA"

      - name: Read verified Dependabot metadata
        id: metadata
        if: steps.scope.outputs.eligible == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Set up mise
        if: steps.scope.outputs.eligible == 'true'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          minimum_release_age: 1d
          install: true
          install_args: aube nodejs yq
          cache: false
          env: false

      - name: Prepare overrides and run the existing normalizer
        id: normalize
        if: steps.scope.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEPENDABOT_UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          mise exec aube nodejs yq -- node "$RUNNER_TEMP/normalize-dependabot.mjs" \
            normalize "$BASE_SHA" "$PR_HEAD" "$RUNNER_TEMP/normalized-dependencies"

      - name: Pass the normalized files to the writer
        if: steps.normalize.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normalized-dependencies
          path: ${{ runner.temp }}/normalized-dependencies/
          if-no-files-found: error
          retention-days: 1

  push:
    name: Commit and push normalization
    needs: normalize
    if: needs.normalize.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: read # Verify the PR is still open at the expected head.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check if the pull request still has the same head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          state_and_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | join(" ")')
          if [[ "$state_and_head" != "open $PR_HEAD" ]]; then
            echo 'Skipped: the pull request was closed or its head moved.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Check out the exact head without persisted credentials
        if: steps.current.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download the normalized files as data
        if: steps.current.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: normalized-dependencies
          path: ${{ runner.temp }}/normalized-dependencies

      - name: Stage only the lockfile and override edits
        if: steps.current.outputs.eligible == 'true'
        run: |
          for file in pnpm-lock.yaml pnpm-workspace.yaml; do
            source="$RUNNER_TEMP/normalized-dependencies/$file"
            [[ -e "$source" || -L "$source" ]] || continue
            [[ -f "$source" && -s "$source" && ! -L "$source" ]]
            [[ -f "$file" && ! -L "$file" ]]
            cat "$source" > "$file"
            git add -- "$file"
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No normalization changes to commit.' >&2
            exit 1
          fi

      - name: Check writer app configuration
        if: steps.current.outputs.eligible == 'true'
        env:
          CLIENT_ID: ${{ secrets.DEPENDABOT_NORMALIZER_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DEPENDABOT_NORMALIZER_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$CLIENT_ID" ]] || missing+=("DEPENDABOT_NORMALIZER_CLIENT_ID")
          [[ -n "$PRIVATE_KEY" ]] || missing+=("DEPENDABOT_NORMALIZER_PRIVATE_KEY")
          for m in "${missing[@]}"; do
            echo "::error title=Writer app not configured::Dependabot secret ${m} is not set. See the setup notes at the top of dependabot-normalization.yaml."
          done
          (( ${#missing[@]} == 0 ))

      - name: Get the writer token so downstream PR CI runs
        if: steps.current.outputs.eligible == 'true'
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPENDABOT_NORMALIZER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_NORMALIZER_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit as the writer App
        if: steps.current.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.bot-token.outputs.app-slug }}
        run: |
          bot="$APP_SLUG[bot]"
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          git -c core.hooksPath=/dev/null -c user.name="$bot" \
            -c user.email="${bot_id}+${bot}@users.noreply.github.com" \
            commit -m 'chore(deps): normalize pnpm dependencies'

      - name: Push if the remote head has not moved
        if: steps.current.outputs.eligible == 'true'
        env:
          PUSH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ref="refs/heads/$PR_BRANCH"
          git check-ref-format "$ref"
          # Never overwrite a newer PR head.
          test "$(git rev-list --parents -n1 HEAD)" = "$(git rev-parse HEAD) $PR_HEAD"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)" \
            git push --force-with-lease="$ref:$PR_HEAD" origin "HEAD:$ref"
          echo 'Committed and pushed dependency normalization.' >> "$GITHUB_STEP_SUMMARY"
