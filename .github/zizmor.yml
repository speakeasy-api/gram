# zizmor (https://docs.zizmor.sh) audits GitHub Actions workflows. hk runs it
# with --pedantic, which is what makes unpinned-images flag `image: repo:tag`
# without a digest.
#
# Pinning is the rule this config exists to enforce: every `uses:` is pinned
# to a commit SHA and every container image to a sha256 digest. Tags are
# mutable, so a tag pin runs whatever the tag points at today.
#
# Every audit is enforced. Where a finding is accepted rather than fixed, the
# workflow carries a `# zizmor: ignore[...]` comment with the reason.
#
# self-repository is ignored on each `uses: ./.github/workflows/composite/...`.
# The runner resolves a `$/` reference while it sets up the job, by downloading
# a tarball of this whole repository (~133 MB), and that added 10-100s to every
# job that used one. Each of these jobs checks out the run's commit as its
# first step, and no workflow here runs on pull_request_target, so `./` loads
# the same file without the download. Use `$/` only when the job has not
# checked out that commit, or when a step before it rewrites `.github/`.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
