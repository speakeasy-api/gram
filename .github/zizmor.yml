# zizmor (https://docs.zizmor.sh) audits GitHub Actions workflows. hk runs it
# with --pedantic, which is what makes unpinned-images flag `image: repo:tag`
# without a digest.
#
# Pinning is the rule this config exists to enforce: every `uses:` is pinned
# to a commit SHA and every container image to a sha256 digest. Tags are
# mutable, so a tag pin runs whatever the tag points at today.
#
# The audits disabled below each have findings on main. They are off so the
# pinning rule can land on its own; turn each one back on as its findings are
# fixed. Audits not listed here are enforced.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # Findings to burn down.
  anonymous-definition:
    disable: true
  artipacked:
    disable: true
  concurrency-limits:
    disable: true
  excessive-permissions:
    disable: true
  github-app:
    disable: true
  template-injection:
    disable: true
  undocumented-permissions:
    disable: true
