# zizmor (https://docs.zizmor.sh) audits GitHub Actions workflows. hk runs it
# with --pedantic, which is what makes unpinned-images flag `image: repo:tag`
# without a digest.
#
# Pinning is the rule this config exists to enforce: every `uses:` is pinned
# to a commit SHA and every container image to a sha256 digest. Tags are
# mutable, so a tag pin runs whatever the tag points at today.
#
# Every audit is enforced. Where a finding is accepted rather than fixed, the
# workflow carries a `# zizmor: ignore[...]` comment with the reason.
#
# self-repository is ignored on each `uses: ./.github/workflows/composite/...`.
# The runner resolves a `$/` reference while it sets up the job, by downloading
# a tarball of this whole repository (~133 MB), and that added 10-100s to every
# job that used one. Each of these jobs checks out the run's commit as its
# first step, and none of their workflows runs on pull_request_target, so `./`
# loads the same file without the download. Use `$/` only when the job has not
# checked out that commit, or when a step before it rewrites `.github/`.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # *.lock.yml files are generated by `gh aw compile` (GitHub Agentic
  # Workflows). The compiler writes a few `# zizmor: ignore` comments of its
  # own, but any we added would be erased by the next compile, and a
  # `file:line` ignore here would drift onto other lines as the file is
  # regenerated. So the accepted findings are listed file-wide, and
  # .mise-tasks/flows/flow-checks.test.mts (CI: agent-checks-test) asserts
  # the properties these rules would otherwise guard: every action pinned to a
  # commit, every image to a digest, every npm install to an exact version
  # with a release-age cooldown, and the token's permissions.
  # - adhoc-packages: gh-aw installs its engine and tool CLIs at run time with
  #   `npm install -g <pkg>@<exact version>` and NPM_CONFIG_MIN_RELEASE_AGE=3,
  #   so neither they nor their dependencies can be newer than three days.
  # - undocumented-permissions: the generated jobs' permissions are derived by
  #   the compiler from the workflow's safe outputs.
  # - self-repository: the `./.github/workflows/composite/...` step in the
  #   source's `steps:`, accepted for the reason given above.
  adhoc-packages:
    ignore:
      - flow-checks.lock.yml
  undocumented-permissions:
    ignore:
      - flow-checks.lock.yml
  self-repository:
    ignore:
      - flow-checks.lock.yml
