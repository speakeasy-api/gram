# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/workflows/composite/build-push"
    schedule:
      interval: "weekly"
    groups:
      artifacts:
        patterns:
          - "actions/download-artifact"
          - "actions/upload-artifact"
  - package-ecosystem: "gomod"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    ignore:
      # Bumped on release by speakeasy-api/mcp-setup-docs (go-module-consumer-bump).
      - dependency-name: "github.com/speakeasy-api/mcp-setup-docs/go"
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      goa:
        patterns:
          - "goa.design/*"
      temporal:
        patterns:
          - "go.temporal.io/*"
      testcontainers:
        patterns:
          - "github.com/testcontainers/*"
      kubernetes:
        patterns:
          - "k8s.io/*"
      redis:
        patterns:
          - "github.com/redis/go-redis/*"
      aws:
        patterns:
          - "github.com/aws/aws-sdk-go-v2/*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
          - "ai"
      assistant-ui:
        patterns:
          - "@assistant-ui/*"
      chartjs:
        patterns:
          - "chart.js"
          - "chartjs-plugin-zoom"
          - "react-chartjs-2"
      class-names:
        patterns:
          - "clsx"
          - "tailwind-merge"
      logtape:
        patterns:
          - "@logtape/*"
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      monaco:
        patterns:
          - "@monaco-editor/*"
          - "monaco-editor"
      openrouter:
        patterns:
          - "@openrouter/*"
      oxc-tooling:
        patterns:
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
      polar-stripe:
        patterns:
          - "@polar-sh/checkout"
          - "@stripe/*"
      radix:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router"
          - "react-router-dom"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      svix:
        patterns:
          - "svix"
          - "svix-react"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
          - "@tailwindcss/typography"
          - "@tailwindcss/vite"
      tanstack:
        patterns:
          - "@tanstack/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      vega:
        patterns:
          - "vega"
          - "vega-interpreter"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
      xstate:
        patterns:
          - "@xstate/*"
          - "xstate"
      zod:
        patterns:
          - "zod"
  - package-ecosystem: "docker"
    directories:
      - "/server"
      - "/agents/runtime-image"
      - "/client/dashboard"
      - "/otel-collector"
      - "/pystreams"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
