contents:
  repositories:
    - "./packages"
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
  packages:
    - alpine-baselayout-data
    - ca-certificates
    - su-exec
    - nodejs~24
    - gram-runner
cmd: gram-runner -language javascript
entrypoint:
  shell-fragment: |
    set -e
    # Alpine's bundle still trusts an affected eMudhra root. Refresh before any network I/O.
    sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' \
      -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
    update-ca-certificates
    gram-runner -init -language javascript
    exec su-exec gram "$0" "$@"

accounts:
  # The actual container will be run as gram. This just allows an init process
  # to prepare the filesystem.
  run-as: root
  groups:
    - groupname: gram
      gid: 10000
  users:
    - username: gram
      uid: 10000
      gid: 10000

work-dir: /var/task

paths:
  - path: /data
    type: directory
    permissions: 0o755
  - path: /var/task
    type: directory
    permissions: 0o755

environment:
  RUNNER_LANGUAGE: javascript
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
