          format: int64
        endpoint_mismatches:
          type: array
          items:
            $ref: '#/components/schemas/IssuerFieldMismatch'
          description: The authorization-server metadata fields (issuer, token_endpoint, authorization_endpoint) that differ from the target, with both sides' values. Non-empty blocks the migration.
        issuer:
          $ref: '#/components/schemas/RemoteSessionIssuer'
        organization_id:
          type: string
          description: The organization that owns the candidate. Empty for a legacy project-scoped issuer written before this column existed.
        organization_name:
          type: string
          description: Display name of the owning organization. Empty when the organization has no synced metadata.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/IssuerFieldMismatch'
          description: Non-blocking divergences (oidc, passthrough, scopes_supported), with both sides' values. The target issuer's values become authoritative for the migrated clients.
      description: An organization- or project-level remote_session_issuer that names the same upstream authorization server as a global issuer, and so could be consolidated onto it.
      required:
        - issuer
        - organization_id
        - organization_name
        - client_count
        - endpoint_mismatches
        - warnings
    IssuerFieldMismatch:
      type: object
      properties:
        field:
          type: string
          description: 'The differing field''s name: issuer, token_endpoint, authorization_endpoint, oidc, passthrough, or scopes_supported.'
        source_value:
          type: string
          description: The source issuer's value for a scalar field, rendered as a string. Null when the source leaves the field unset, and null for a list-valued field.
        source_values:
          type: array
          items:
            type: string
          description: The source issuer's entries for a list-valued field. Absent for a scalar field, and absent when the source's list is empty.
        target_value:
          type: string
          description: The target issuer's value for a scalar field, rendered as a string. Null when the target leaves the field unset, and null for a list-valued field.
        target_values:
          type: array
          items:
            type: string
          description: The target issuer's entries for a list-valued field. Absent for a scalar field, and absent when the target's list is empty.
      description: One remote_session_issuer field whose value differs between the source and target of a consolidation, with both sides' values.
      required:
        - field
    IssuerMigratePreflight:
      type: object
      properties:
        can_migrate:
          type: boolean
          description: 'TRUE when the migration would succeed: no endpoint mismatches and no conflicting MCP-server bindings.'
        client_count:
          type: integer
          description: Number of non-deleted remote_session_clients that would be re-pointed from the source issuer to the target issuer.
          format: int64
        conflicting_mcp_server_names:
          type: array
          items:
            type: string
          description: Display names of MCP servers where both the source and the target issuer already have a client bound. Non-empty blocks the migration; detach one client per listed server and retry.
        endpoint_mismatches:
          type: array
          items:
            $ref: '#/components/schemas/IssuerFieldMismatch'
          description: The authorization-server metadata fields (issuer, token_endpoint, authorization_endpoint) that differ between source and target, with both sides' values. Non-empty blocks the migration.
        mcp_server_names:
          type: array
          items:
            type: string
          description: Display names of MCP servers attached to the source issuer's clients.
        target_tenant_client_count:
          type: integer
          description: Number of tenant-owned remote_session_clients already registered with the target issuer, BEFORE this migration. Any non-zero value blocks deleting the target issuer, and only the owning organizations can clear it, so a successful migration is effectively one-way.
          format: int64
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/IssuerFieldMismatch'
          description: Non-blocking divergences (oidc, passthrough, scopes_supported), with both sides' values. The target issuer's values become authoritative for the migrated clients.
      description: 'Authoritative impact summary for consolidating a tenant remote_session_issuer onto a global one: how many clients move, which MCP servers are affected, every blocker that would make the migration fail, and how many tenant-owned clients the target already carries.'
      required:
        - client_count
        - mcp_server_names
        - endpoint_mismatches
        - conflicting_mcp_server_names
        - warnings
        - can_migrate
        - target_tenant_client_count
    ListGlobalRemoteSessionIssuersResult:
