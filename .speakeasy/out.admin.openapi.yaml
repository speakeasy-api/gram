          description: OK response.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Content-Length:
              schema:
                format: int64
                type: integer
            Content-Type:
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
                description: PNG, JPEG, GIF or WebP image bytes; Content-Type preserves the stored image MIME type.
