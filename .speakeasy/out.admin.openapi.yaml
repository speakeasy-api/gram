            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'forbidden: permission denied'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: resource not found'
        "409":
          content:
            application/json:
              schema:
