    AuditLog:
      type: object
      properties:
        acting_client_id:
          type: string
          description: The registered OAuth client the call authenticated as, when it had one. Absent for calls that carried no OAuth client.
        acting_surface:
          type: string
          description: 'How the change was made: ''dashboard'', ''api_key'', ''platform_mcp'', ''project_assistant'', or ''unknown'' when no surface was identifiable. Always present.'
        action:
          type: string
        actor_display_name:
          type: string
        actor_id:
          type: string
        actor_slug:
          type: string
        actor_type:
          type: string
        after_snapshot: {}
        before_snapshot: {}
        created_at:
          type: string
          description: The creation date of the audit log.
          format: date-time
        id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        project_id:
          type: string
        project_slug:
          type: string
        subject_display_name:
          type: string
        subject_id:
          type: string
        subject_slug:
          type: string
        subject_type:
          type: string
      required:
        - id
        - actor_id
        - actor_type
        - action
        - subject_id
        - subject_type
        - acting_surface
        - created_at
    BulkUpdateAccountTypeRequestBody:
