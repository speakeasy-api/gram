          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'bad_request: request is invalid'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'unauthorized: unauthorized access'
        "403":
