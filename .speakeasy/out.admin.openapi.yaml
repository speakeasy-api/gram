    RemoteSessionIssuer:
      type: object
      properties:
        authorization_endpoint:
          type: string
          description: Upstream authorization endpoint.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: Whether the issuer includes the RFC 9207 iss parameter in authorization responses. Null until discovery captures the field.
        backchannel_logout_supported:
          type: boolean
          description: Whether the issuer supports OpenID Connect Back-Channel Logout. Null until discovery captures the field.
        claims_supported:
          type: array
          items:
            type: string
          description: Claims the issuer can return in ID tokens and from userinfo. Null until discovery captures the field; an empty array means the field was captured and the issuer advertises none.
          nullable: true
        client_id_metadata_document_supported:
          type: boolean
          description: Whether the issuer accepts a Client ID Metadata Document URL as client_id (OAuth CIMD draft).
        client_setup_documentation_url:
          type: string
          description: URL of OAuth client setup documentation shown when creating clients. Manually set, not RFC 8414; null when unset.
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: PKCE code challenge methods advertised by the issuer (RFC 8414 code_challenge_methods_supported). Null when neither discovery nor an operator has captured the field for this issuer yet; an empty array means the field was captured and the issuer advertises no methods.
          nullable: true
        created_at:
          type: string
          format: date-time
        grant_types_supported:
          type: array
          items:
            type: string
        id:
          type: string
          description: The remote_session_issuer id.
          format: uuid
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: JWS algorithms the issuer signs ID tokens with. Null until discovery captures the field; an empty array means the field was captured and the issuer advertises none.
          nullable: true
        introspection_endpoint:
          type: string
          description: RFC 7662 token introspection endpoint. Null when not advertised or not yet captured by discovery.
        introspection_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Client authentication methods the introspection endpoint accepts. Null until discovery captures the field; an empty array means the field was captured and the issuer advertises none.
          nullable: true
        issuer:
          type: string
          description: Issuer URL; matches the iss claim.
        jwks_uri:
          type: string
          description: Upstream JWKS URI; null when not advertised.
        logo_asset_id:
          type: string
          description: Optional logo asset id; null when unset.
          format: uuid
        name:
          type: string
          description: Optional display name; null when unset.
        oidc:
          type: boolean
          description: When true, may unlock OIDC-aware behaviour.
        op_policy_uri:
          type: string
          description: RFC 8414 op_policy_uri; the issuer's client data-usage policy. Null when not advertised.
        op_tos_uri:
          type: string
          description: RFC 8414 op_tos_uri; the issuer's terms of service. Null when not advertised.
        organization_id:
          type: string
          description: The owning organization id. Empty for legacy rows not yet backfilled.
        passthrough:
          type: boolean
          description: When true, the MCP client registers and transacts directly with this issuer.
        project_id:
          type: string
          description: The owning project id. Empty for organization-level issuers.
        registration_endpoint:
          type: string
          description: Upstream RFC 7591 registration endpoint; null for issuers without DCR.
        resource_indicator_supported:
          type: boolean
          description: Whether the issuer accepts the RFC 8707 resource parameter, as an operator stated it. Null when unset; false omits the parameter on every grant.
        response_types_supported:
          type: array
          items:
            type: string
        revocation_endpoint:
          type: string
          description: Upstream RFC 7009 revocation endpoint; null when the issuer advertises none.
        scope_override:
          type: array
          items:
            type: string
          description: Operator-pinned scope request, sent verbatim on the upstream authorize redirect in place of the resolved scope set. Null when unset.
          nullable: true
        scopes_supported:
          type: array
          items:
            type: string
        service_documentation:
          type: string
          description: RFC 8414 service_documentation; developer documentation for the issuer. Null when not advertised.
        slug:
          type: string
          description: Project-unique slug.
        token_endpoint:
          type: string
          description: Upstream token endpoint.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
        userinfo_endpoint:
          type: string
          description: OpenID Connect userinfo endpoint. Null when not advertised or not yet captured by discovery.
      description: A remote_session_issuer record — upstream Authorization Server identity that Gram speaks OAuth to.
      required:
        - id
        - project_id
        - organization_id
        - slug
        - issuer
        - oidc
        - passthrough
        - client_id_metadata_document_supported
        - created_at
        - updated_at
    RemoteSessionIssuerDraft:
      type: object
      properties:
        authorization_endpoint:
          type: string
          description: Upstream authorization endpoint.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: Whether the discovery document advertises the RFC 9207 iss parameter in authorization responses; false when the document omits the field.
