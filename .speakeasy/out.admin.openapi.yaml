    CreateRemoteSessionIssuerForm:
      type: object
      properties:
        authorization_endpoint:
          type: string
          description: Upstream authorization endpoint.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: Whether the issuer includes the RFC 9207 iss parameter in authorization responses. Omitting the field stores null ("not captured").
        backchannel_logout_supported:
          type: boolean
          description: Whether the issuer supports OpenID Connect Back-Channel Logout. Omitting the field stores null ("not captured").
        claims_supported:
          type: array
          items:
            type: string
          description: Claims the issuer can return in ID tokens and from userinfo. Omitting the field stores null ("not captured"), distinct from an empty array ("the issuer advertises none").
        client_id_metadata_document_supported:
          type: boolean
          description: When true, the issuer accepts a Client ID Metadata Document URL as client_id (OAuth CIMD draft). Discovered from the issuer metadata document and used to pre-flight outbound CIMD. Default false.
        client_setup_documentation_url:
          type: string
          description: URL of OAuth client setup documentation shown when creating clients. Manually set, not RFC 8414; rejected unless an absolute http(s) URL.
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: PKCE code challenge methods advertised by the issuer (RFC 8414 code_challenge_methods_supported). Omitting the field stores null ("not captured"), distinct from an empty array ("the issuer advertises no methods").
        grant_types_supported:
          type: array
          items:
            type: string
          description: Grant types advertised by the issuer.
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: JWS algorithms the issuer signs ID tokens with. Omitting the field stores null ("not captured"), distinct from an empty array ("the issuer advertises none").
        introspection_endpoint:
          type: string
          description: RFC 7662 token introspection endpoint. Discovered from the issuer metadata document; rejected unless an absolute https URL, or http on loopback.
        introspection_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Client authentication methods the introspection endpoint accepts. Omitting the field stores null ("not captured"), distinct from an empty array ("the issuer advertises none").
        issuer:
          type: string
          description: Issuer URL; matches the iss claim.
        jwks_uri:
          type: string
          description: Upstream JWKS URI.
        logo_asset_id:
          type: string
          description: Optional logo asset id.
          format: uuid
        name:
          type: string
          description: Optional display name. Stored NULL when empty; clients fall back to the issuer URL/slug.
        oidc:
          type: boolean
          description: When true, may unlock OIDC-aware behaviour. Default false.
        op_policy_uri:
          type: string
          description: RFC 8414 op_policy_uri; the issuer's client data-usage policy. Discovered from the issuer metadata document; rejected unless an absolute http(s) URL.
        op_tos_uri:
          type: string
          description: RFC 8414 op_tos_uri; the issuer's terms of service. Discovered from the issuer metadata document; rejected unless an absolute http(s) URL.
        passthrough:
          type: boolean
          description: When true, the MCP client registers and transacts directly with this issuer. Default false.
        registration_endpoint:
          type: string
          description: Upstream RFC 7591 registration endpoint; absent for issuers without DCR.
        resource_indicator_supported:
          type: boolean
          description: 'Whether the issuer accepts the RFC 8707 resource parameter. Omit to leave it unset: the parameter is then sent, and a login or refresh the issuer answers with invalid_target is retried once without it. Set false to never send it.'
        response_types_supported:
          type: array
          items:
            type: string
          description: Response types advertised by the issuer.
        revocation_endpoint:
          type: string
          description: Upstream RFC 7009 revocation endpoint; absent for issuers that advertise none.
        scope_override:
          type: array
          items:
            type: string
          description: Operator-pinned scope request. When set, it is sent verbatim on the upstream authorize redirect in place of the resolved scope set. Omit or send an empty array to leave it unset.
        scopes_supported:
          type: array
          items:
            type: string
          description: Scopes advertised by the issuer.
        service_documentation:
          type: string
          description: RFC 8414 service_documentation; developer documentation for the issuer. Discovered from the issuer metadata document; rejected unless an absolute http(s) URL.
        slug:
          type: string
          description: Project-unique slug.
        token_endpoint:
          type: string
          description: Upstream token endpoint.
        token_endpoint_auth_methods_supported:
          type: array
          items:
