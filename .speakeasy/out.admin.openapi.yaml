components:
  schemas:
    AdminBulkUpdateAccountTypeResult:
      type: object
      properties:
        missing_ids:
          type: array
          items:
            type: string
          description: IDs from the request that matched no organization, deduplicated and in request order. Nothing was written for these.
        updated_ids:
          type: array
          items:
            type: string
          description: 'IDs of the organizations whose account type was set. Order is unspecified: do not rely on it.'
      description: Outcome of a bulk account type change.
      required:
        - updated_ids
        - missing_ids
    AdminChatAnalysisSettings:
      type: object
      properties:
        business_memory_daily_cap:
          type: integer
          format: int64
        business_memory_enabled:
          type: boolean
        is_default:
          type: boolean
        organization_id:
          type: string
        work_units_daily_cap:
          type: integer
          format: int64
        work_units_enabled:
          type: boolean
      required:
        - organization_id
        - work_units_enabled
        - work_units_daily_cap
        - business_memory_enabled
        - business_memory_daily_cap
        - is_default
    AdminChatAnalysisTriggerResult:
      type: object
      properties:
        projects_signaled:
          type: integer
          format: int64
      required:
        - projects_signaled
    AdminInferenceKey:
      type: object
      properties:
        credits_used:
          type: number
          description: Credits spent this month in USD.
          format: double
        disable_causes:
          type: array
          items:
            type: string
          description: Active internal disable causes. Omitted for legacy unclassified rows.
        disable_causes_classified:
          type: boolean
          description: Whether disable_causes is classified, including an explicitly empty cause set.
        disabled:
          type: boolean
        key_type:
          type: string
        monthly_credits:
          type: integer
          format: int64
      description: Current usage and configured state for one materialized platform-managed OpenRouter key, without key material or provider identifiers.
      required:
        - key_type
        - credits_used
        - monthly_credits
        - disabled
        - disable_causes_classified
    AdminInferenceKeyLimit:
      type: object
      properties:
        key_type:
          type: string
        monthly_credits:
          type: integer
          format: int64
      description: The configured monthly limit for one materialized platform-managed OpenRouter key.
      required:
        - key_type
        - monthly_credits
    AdminInferenceSpendMonth:
      type: object
      properties:
        period_end:
          type: string
          description: Exclusive end of the UTC calendar month.
          format: date
        period_start:
          type: string
          format: date
        spend_usd:
          type: string
      required:
        - period_start
        - period_end
        - spend_usd
    AdminListOrganizationActivityResult:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
          description: List of organization activity.
        next_cursor:
          type: string
          description: Cursor for the next page of results.
      required:
        - logs
    AdminListOrganizationMembersResult:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganizationMember'
          description: The members of the organization.
      required:
        - members
    AdminListOrganizationProjectsResult:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/AdminProject'
          description: The projects belonging to the organization.
      required:
        - projects
    AdminListOrganizationsResult:
      type: object
      properties:
        next_cursor:
          type: string
          description: Cursor for the next page; empty when exhausted. Omitted in offset mode.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'
          description: The page of organizations.
        total:
          type: integer
          description: Number of organizations matching the filters, before paging.
          format: int64
      required:
        - organizations
        - total
    AdminOrganization:
      type: object
      properties:
        account_type:
          type: string
          description: Gram account type (e.g. free, pro, payg, enterprise).
        created_at:
          type: string
          description: The creation date of the organization.
          format: date-time
        disabled_at:
          type: string
          description: The time at which the organization was disabled, if any.
          format: date-time
        id:
          type: string
          description: The ID of the organization
        member_count:
          type: integer
          description: Number of active members in the organization.
          format: int64
        name:
          type: string
          description: The name of the organization
        slug:
          type: string
          description: The slug of the organization
        trial_converted_at:
          type: string
          description: The time at which the trial converted to a paid plan, if any.
          format: date-time
        trial_demoted_at:
          type: string
          description: The time at which the organization was demoted after its trial, if any.
          format: date-time
        trial_ends_at:
          type: string
          description: The time at which the enterprise trial ends. Absent when the organization never trialled.
          format: date-time
        trial_state:
          type: string
          description: Lifecycle state of the organization's enterprise trial.
          enum:
            - none
            - running
            - ending_soon
            - expired
            - demoted
            - converted
        trial_tier:
          type: string
          description: The trial tier. Absent when the organization never trialled.
        updated_at:
          type: string
          description: The last update date of the organization.
          format: date-time
        whitelisted:
          type: boolean
          description: Whether the organization is whitelisted for full access.
        workos_id:
          type: string
          description: WorkOS organization ID, if linked.
      description: Organization details surfaced to admin operators.
      required:
        - id
        - name
        - slug
        - account_type
        - whitelisted
        - member_count
        - created_at
        - updated_at
    AdminOrganizationMember:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
          description: User display name.
        email:
          type: string
          description: User email address.
        id:
          type: string
          description: User ID.
        last_login:
          type: string
          description: The time the user last logged in, if any.
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Organization member surfaced to admin operators.
      required:
        - id
        - email
        - display_name
        - created_at
        - updated_at
    AdminOrganizationStats:
      type: object
