            - platform_mcp
            - customer_managed_encryption_keys
            - remote_session_auto_refresh
            - remote_session_auto_refresh_enforced
            - consent_tool_filtering
            - session_portability
          maxLength: 60
        organization_id:
          type: string
      required:
