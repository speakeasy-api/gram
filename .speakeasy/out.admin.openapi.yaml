    UpdateRemoteSessionIssuerForm:
      type: object
      properties:
        authorization_endpoint:
          type: string
          description: Upstream authorization endpoint.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: Whether the issuer includes the RFC 9207 iss parameter in authorization responses. Omitting the field leaves the stored value unchanged.
        backchannel_logout_supported:
          type: boolean
          description: Whether the issuer supports OpenID Connect Back-Channel Logout. Omitting the field leaves the stored value unchanged.
        claims_supported:
          type: array
          items:
            type: string
          description: Claims the issuer can return in ID tokens and from userinfo. Omitting the field leaves the stored value unchanged; an empty array records that the issuer advertises none.
        client_id_metadata_document_supported:
          type: boolean
          description: Whether the issuer accepts a Client ID Metadata Document URL as client_id (OAuth CIMD draft).
        client_setup_documentation_url:
          type: string
          description: Set or clear the URL of OAuth client setup documentation shown when creating clients. An empty string clears it to NULL; any other value must be an absolute http(s) URL.
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: PKCE code challenge methods advertised by the issuer (RFC 8414 code_challenge_methods_supported). Omitting the field leaves the stored value unchanged; an empty array records that the issuer advertises no methods.
        grant_types_supported:
          type: array
          items:
            type: string
        id:
          type: string
          description: The remote_session_issuer id.
          format: uuid
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: JWS algorithms the issuer signs ID tokens with. Omitting the field leaves the stored value unchanged; an empty array records that the issuer advertises none.
        introspection_endpoint:
          type: string
          description: Set or clear the RFC 7662 token introspection endpoint. An empty string clears it to NULL; any other value must be an absolute https URL, or http on loopback.
        introspection_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Client authentication methods the introspection endpoint accepts. Omitting the field leaves the stored value unchanged; an empty array records that the issuer advertises none.
        issuer:
          type: string
          description: Issuer URL; matches the iss claim.
        jwks_uri:
          type: string
          description: Upstream JWKS URI.
        logo_asset_id:
          type: string
          description: Set or clear the logo asset id. An empty string clears it to NULL; any other value must be a uuid.
        name:
          type: string
          description: Set or clear the display name. An empty string clears it to NULL.
        oidc:
          type: boolean
        op_policy_uri:
          type: string
          description: Set or clear RFC 8414 op_policy_uri. An empty string clears it to NULL; any other value must be an absolute http(s) URL.
        op_tos_uri:
          type: string
          description: Set or clear RFC 8414 op_tos_uri. An empty string clears it to NULL; any other value must be an absolute http(s) URL.
        passthrough:
          type: boolean
        registration_endpoint:
          type: string
          description: Upstream RFC 7591 registration endpoint.
        resource_indicator_supported:
          type: boolean
          description: Whether the issuer accepts the RFC 8707 resource parameter. Omitting the field leaves the stored value unchanged.
        response_types_supported:
          type: array
          items:
            type: string
        revocation_endpoint:
          type: string
          description: Upstream RFC 7009 revocation endpoint.
        scope_override:
          type: array
          items:
            type: string
          description: Set or clear the operator-pinned scope request. Omitting the field (or sending null) leaves the stored value unchanged; an empty array clears it.
          nullable: true
        scopes_supported:
          type: array
          items:
            type: string
        service_documentation:
          type: string
          description: Set or clear RFC 8414 service_documentation. An empty string clears it to NULL; any other value must be an absolute http(s) URL.
        slug:
          type: string
          description: Rename the slug.
        token_endpoint:
          type: string
          description: Upstream token endpoint.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        userinfo_endpoint:
          type: string
          description: Set or clear the OpenID Connect userinfo endpoint. An empty string clears it to NULL; any other value must be an absolute https URL, or http on loopback.
      description: Form for updating a remote_session_issuer. All non-id fields are optional patches.
      required:
        - id
    UploadImageResult:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
      required:
        - asset
