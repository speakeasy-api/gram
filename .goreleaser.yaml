# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.12.5/www/docs/static/schema-pro.json

version: 2

builds:
  - id: speakeasy
    binary: speakeasy
    dir: ./cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/speakeasy-api/gram/cli/internal/app.GitSHA={{.Commit}} -X github.com/speakeasy-api/gram/cli/internal/app.Version={{.Version}}"

  # The same program built under the legacy gram name. Its archives keep the
  # gram_<os>_<arch>.zip names that `gram update`, install scripts, and the
  # aqua registry download from older releases. The binary prints a
  # deprecation notice when run as gram. Remove once the gram name is retired.
  - id: gram
    binary: gram
    dir: ./cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/speakeasy-api/gram/cli/internal/app.GitSHA={{.Commit}} -X github.com/speakeasy-api/gram/cli/internal/app.Version={{.Version}}"

archives:
  - id: speakeasy
    ids:
      - speakeasy
    name_template: "speakeasy_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - zip

  - id: gram
    ids:
      - gram
    name_template: "gram_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - zip
checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  mode: keep-existing

monorepo:
  tag_prefix: "cli@"

brews:
  - name: cli
    ids:
      - speakeasy
    repository:
      owner: speakeasy-api
      name: homebrew-tap
    homepage: https://ai.speakeasy.com
    description: Speakeasy AI Control Plane CLI
    license: AGPL-3.0-only
    # The Speakeasy SDK generator formula (speakeasy-api/tap/speakeasy) also
    # installs a binary named speakeasy.
    conflicts:
      - speakeasy
    install: |
      bin.install "speakeasy"
    test: |
      system "#{bin}/speakeasy --version"

  # Legacy formulas: install the speakeasy binary under the gram name so
  # existing installs and scripts keep working. They are deprecated in
  # Homebrew, which warns on install and upgrade but keeps them installable.
  # Homebrew prints "<name> has been deprecated because it <because>!".
  # deprecate! leaves out replacement_formula: older Homebrew versions don't
  # know that keyword and would fail to load the formula.
  - name: gram
    ids:
      - speakeasy
    repository:
      owner: speakeasy-api
      name: homebrew-tap
    homepage: https://ai.speakeasy.com
    description: Speakeasy AI Control Plane CLI (deprecated gram command; use the cli formula)
    license: AGPL-3.0-only
    custom_block: |
      deprecate! date: "2026-10-06", because: "has been renamed to speakeasy (brew install speakeasy-api/tap/cli)"
    install: |
      bin.install "speakeasy" => "gram"
    test: |
      system "#{bin}/gram --version"

  - name: gram@{{ .Major }}.{{ .Minor }}.{{ .Patch }}
    ids:
      - speakeasy
    repository:
      owner: speakeasy-api
      name: homebrew-tap
    homepage: https://ai.speakeasy.com
    description: Speakeasy AI Control Plane CLI (deprecated gram command; use the cli formula)
    license: AGPL-3.0-only
    custom_block: |
      deprecate! date: "2026-10-06", because: "has been renamed to speakeasy (brew install speakeasy-api/tap/cli)"
    install: |
      bin.install "speakeasy" => "gram"
    test: |
      system "#{bin}/gram --version"

npms:
  - name: "@speakeasy-api/cli"
    ids:
      - speakeasy
    description: Speakeasy AI Control Plane CLI
    homepage: https://ai.speakeasy.com
    keywords:
      - speakeasy
      - mcp
      - cli
    license: AGPL-3.0-only
    author: Speakeasy, Inc
    repository: https://github.com/speakeasy-api/gram
    bugs: https://github.com/speakeasy-api/gram/issues
    access: public
    format: zip
    files:
      - glob: ./cli/README.md
        name_template: README.md
      - glob: ./LICENSE

