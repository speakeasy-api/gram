[package]
name = "gram-code-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["io"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
monty-pool = { git = "https://github.com/pydantic/monty", rev = "15753b35e8eee6d569f223cd19f0303dbf07f896" }
monty-types = { git = "https://github.com/pydantic/monty", rev = "15753b35e8eee6d569f223cd19f0303dbf07f896" }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
uuid = { version = "1", features = ["v4"] }
yamux = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
