version: "2"
sql:
  - schema: schema.sql
    queries: queries.sql
    engine: sqlite
    gen:
      go:
        package: "repo"
        out: "repo"
        sql_package: "database/sql"
        emit_pointers_for_null_types: false
        omit_unused_structs: true
        overrides:
          # users
          - column: "users.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "users.admin"
            go_type: "bool"
          - column: "users.whitelisted"
            go_type: "bool"
          # organizations
          - column: "organizations.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # memberships
          - column: "memberships.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "memberships.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "memberships.organization_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # oauth_clients
          - column: "oauth_clients.rotate_refresh_tokens"
            go_type: "bool"
          # auth_codes
          - column: "auth_codes.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # tokens
          - column: "tokens.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # invitations
          - column: "invitations.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "invitations.organization_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "invitations.inviter_user_id"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          # organization_roles
          - column: "organization_roles.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "organization_roles.organization_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # xaa_apps
          - column: "xaa_apps.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_apps.enabled"
            go_type: "bool"
          # xaa_resources
          - column: "xaa_resources.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # xaa_app_assignments
          - column: "xaa_app_assignments.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_app_assignments.app_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_app_assignments.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_app_assignments.resource_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # xaa_trust_rules
          - column: "xaa_trust_rules.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_trust_rules.resource_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_trust_rules.enabled"
            go_type: "bool"
          # xaa_issued_jags
          - column: "xaa_issued_jags.app_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_issued_jags.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_issued_jags.resource_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # xaa_redeemed_jags
          - column: "xaa_redeemed_jags.resource_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # xaa_resource_tokens
          - column: "xaa_resource_tokens.resource_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "xaa_resource_tokens.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
