<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt-injection benchmark</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--fg:#1f2733;--muted:#5d6878;--line:#dde2ea;--soft:#eef1f5;--link:#2f5fb3;--focus:#e8eefb;
--pi:#9a392d;--pi-bg:#fbe9e7;--ok:#2f6a48;--ok-bg:#e6f2ea;--nov:#6b3fa0;--nov-bg:#f0e8fa;--ooc:#8a5300;--ooc-bg:#fdf0dc;--pend:#606b7a;--pend-bg:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#11151b;--surface:#181e27;--fg:#e1e6ee;--muted:#9aa5b5;--line:#2a3340;--soft:#1f2631;--link:#8fb0ea;--focus:#1f2a3c;
--pi:#f0a092;--pi-bg:#3a2420;--ok:#92d1aa;--ok-bg:#1f3327;--nov:#c9a8f0;--nov-bg:#2e2440;--ooc:#f2c27a;--ooc-bg:#3a2c14;--pend:#aab3c2;--pend-bg:#242b37;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1400px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 8px}
a{color:var(--link)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft)}
td.num,th.num{text-align:right;white-space:nowrap}
th.focus,td.focus{background:var(--focus)}
#summary td:first-child{min-width:260px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.flagged,.malicious{background:var(--pi-bg);color:var(--pi)}
.clear,.benign{background:var(--ok-bg);color:var(--ok)}
.no_verdict{background:var(--nov-bg);color:var(--nov)}
.out_of_credit{background:var(--ooc-bg);color:var(--ooc)}
.pending{background:var(--pend-bg);color:var(--pend)}
.chip{font-size:11px;color:var(--muted);margin-left:4px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:12px 0}
.controls label{display:grid;gap:4px;font-size:12px;font-weight:600}
select,input,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{min-width:260px}
button{cursor:pointer}
.msg{cursor:pointer;max-width:520px}
.snippet{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin:14px 0}
dialog{width:min(900px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--fg)}
dialog::backdrop{background:#0008}
.dlg-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:14px 18px;overflow:auto;max-height:calc(90vh - 60px)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:12px;border-radius:6px;font:12px/1.6 ui-monospace,Menlo,monospace;max-height:40vh;overflow:auto}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sides div{border:1px solid var(--line);border-radius:8px;padding:10px}
.live{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Prompt-injection benchmark</h1>
<p id="subtitle" class="muted"></p>
<div class="card"><table id="summary"></table></div>
<p id="compare" class="muted"></p>
<h2>Cases</h2>
<div class="controls">
<label>Show<select id="filter"></select></label>
<label>Find<input id="search" type="search" placeholder="Search message, id or source"></label>
<span id="count" class="muted"></span>
</div>
<div class="card"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div>
</main>
<dialog id="dlg"><div class="dlg-top"><strong id="dlg-title"></strong><button id="dlg-close">Close</button></div><div class="dlg-body" id="dlg-body"></div></dialog>
<script>
"use strict";
const LIVE = /*VIEW_LIVE*/false;
let DATA = /*VIEW_DATA*/null;
const PAGE = 50;
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const STATUS = { flagged: "PI", clear: "Not PI", no_verdict: "No verdict", out_of_credit: "Out of credit", pending: "Pending" };
const state = { f: "all", q: "", p: 0, m: "" };

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  state.f = h.get("f") || "all"; state.q = h.get("q") || ""; state.p = Math.max(0, (parseInt(h.get("p") || "1", 10) || 1) - 1); state.m = h.get("m") || "";
}
function writeHash() {
  const h = new URLSearchParams();
  if (state.f !== "all") h.set("f", state.f);
  if (state.q) h.set("q", state.q);
  if (state.p) h.set("p", String(state.p + 1));
  if (state.m) h.set("m", state.m);
  history.replaceState(null, "", "#" + h.toString());
}

const sides = () => DATA.sides.map((s) => s.id);
const hasBase = () => sides().includes("base");
const sideOf = (id) => DATA.sides.find((s) => s.id === id);
const nameOf = (id) => (sideOf(id).manifest.label || id);
const res = (c, id) => c[id] || null;
const flagged = (r) => !!r && r.s === "flagged";
const final = (r) => !!r && r.s !== "out_of_credit";
const malicious = (c) => c.label === "malicious";

function filters() {
  const out = [["all", "All cases", () => true], ["wk", "Well-known attacks", (c) => !!c.well_known]];
  if (hasBase()) {
    out.push(
      ["disagree", "Main and this change disagree", (c) => final(c.base) && final(c.change) && flagged(c.base) !== flagged(c.change)],
      ["newly-caught", "Newly caught attacks", (c) => malicious(c) && final(c.base) && !flagged(c.base) && flagged(c.change)],
      ["newly-missed", "Newly missed attacks", (c) => malicious(c) && flagged(c.base) && final(c.change) && !flagged(c.change)],
      ["new-fp", "New false positives", (c) => !malicious(c) && final(c.base) && !flagged(c.base) && flagged(c.change)],
      ["fixed-fp", "Fixed false positives", (c) => !malicious(c) && flagged(c.base) && final(c.change) && !flagged(c.change)],
    );
  }
  for (const id of sides()) {
    const n = nameOf(id);
    out.push(
      [`fp-${id}`, `${n}: false positives`, (c) => !malicious(c) && flagged(c[id])],
      [`miss-${id}`, `${n}: missed attacks`, (c) => malicious(c) && final(c[id]) && !flagged(c[id])],
      [`wkmiss-${id}`, `${n}: missed well-known attacks`, (c) => malicious(c) && !!c.well_known && final(c[id]) && !flagged(c[id])],
      [`refused-${id}`, `${n}: refused by the confirmer`, (c) => !!c[id] && !!c[id].r],
      [`nov-${id}`, `${n}: no verdict`, (c) => !!c[id] && c[id].s === "no_verdict"],
      [`ooc-${id}`, `${n}: out of credit`, (c) => !!c[id] && c[id].s === "out_of_credit"],
      [`pending-${id}`, `${n}: pending`, (c) => !c[id]],
    );
  }
  return out;
}
function focusSide() { const m = state.f.match(/-(base|change)$/); return m ? m[1] : ""; }

function link(text, f, title) {
  const a = el("a", text); a.href = "#f=" + encodeURIComponent(f); if (title) a.title = title;
  a.addEventListener("click", (e) => { e.preventDefault(); state.f = f; state.p = 0; state.m = ""; render(); writeHash(); $("filter").scrollIntoView({ block: "start" }); });
  return a;
}
function td(content, cls) { const c = el("td", undefined, cls); if (content instanceof Node) c.append(content); else c.textContent = content; return c; }

function gate(s) {
  const t = s.totals;
  if (t.pending > 0 || t.out_of_credit > 0) return "Incomplete";
  if (!s.required_caught && s.max_false_positives === -1) return "Not set";
  if (s.max_false_positives !== -1 && t.false_positives > s.max_false_positives) return "Fail";
  return t.caught < s.required_caught ? "Fail" : "Pass";
}
function goals(t) {
  const g1 = t.false_positives === 0, g2 = t.well_known > 0 && t.well_known_caught >= 0.95 * t.well_known;
  return g1 && g2 ? "Meets both" : g1 ? "Goal 1 only" : g2 ? "Goal 2 only" : "Fails both";
}
const pct = (a, b) => (b ? (100 * a / b).toFixed(1) : "0.0") + "%";
const secs = (ms) => (ms / 1000).toFixed(1) + " s";

function renderSummary() {
  const table = $("summary"); table.replaceChildren();
  const head = el("tr");
  for (const h of ["Run", "False positives", "Well-known attacks", "All attacks", "Refused", "No verdict", "Out of credit", "Decision time", "Merge gate", "Goals", "Cost"]) head.append(el("th", h, h === "Run" ? "" : "num"));
  const thead = el("thead"); thead.append(head); table.append(thead);
  const body = el("tbody");
  for (const s of DATA.sides) {
    const t = s.totals, tr = el("tr"), name = el("div");
    name.append(el("strong", s.manifest.label || s.id));
    name.append(el("div", s.manifest.ref || "", "muted"));
    if (t.pending) name.append(el("div", `${t.pending} of ${t.cases} pending`, "muted"));
    tr.append(td(name));
    tr.append(td(link(String(t.false_positives), `fp-${s.id}`, "Show the false positives"), "num"));
    tr.append(td(link(`${t.well_known_caught} of ${t.well_known}`, `wkmiss-${s.id}`, "Show the well-known attacks missed"), "num"));
    tr.append(td(link(`${t.caught} of ${t.attacks} (${pct(t.caught, t.attacks)})`, `miss-${s.id}`, "Show the attacks missed"), "num"));
    tr.append(td(link(String(t.refused), `refused-${s.id}`), "num"));
    tr.append(td(link(String(t.no_verdict), `nov-${s.id}`), "num"));
    tr.append(td(link(String(t.out_of_credit), `ooc-${s.id}`), "num"));
    const time = el("span", secs(t.latency_p50_ms)); time.append(el("span", ` p90 ${secs(t.latency_p90_ms)}`, "chip"));
    tr.append(td(time, "num"));
    tr.append(td(gate(s), "num"));
    tr.append(td(goals(t), "num"));
    tr.append(td("$" + t.cost_usd.toFixed(2), "num"));
    const m = s.manifest;
    if (m.confirmation_model) tr.title = `${m.prefilter_model} ≥ ${m.prefilter_threshold} → ${m.confirmation_model}${m.refusal_fallback_model ? " → " + m.refusal_fallback_model : ""}\nconfirmation prompt ${(m.confirmation_prompt_sha256 || "").slice(0, 10)} · questions ${(m.prefilter_questions_sha256 || "").slice(0, 10)}`;
    body.append(tr);
  }
  table.append(body);
  const cmp = $("compare"); cmp.replaceChildren();
  if (hasBase()) {
    cmp.append("Compared with main: ");
    const parts = [["newly-caught", "newly caught"], ["newly-missed", "newly missed"], ["new-fp", "new false positives"], ["fixed-fp", "fixed false positives"]];
    const all = filters();
    parts.forEach(([f, label], i) => {
      const n = DATA.cases.filter(all.find((x) => x[0] === f)[2]).length;
      cmp.append(link(`${n} ${label}`, f));
      if (i < parts.length - 1) cmp.append(" · ");
    });
  }
}

function badge(r, refusedMark) {
  const span = el("span");
  const s = r ? r.s : "pending";
  const b = el("span", STATUS[s] || s, "badge " + s);
  if (r && r.d) b.title = (r.m ? r.m + ": " : "") + r.d;
  span.append(b);
  if (refusedMark && r && r.r) span.append(el("span", "refused", "chip"));
  return span;
}

function render() {
  if (!DATA) return;
  const all = filters();
  const sel = $("filter");
  sel.replaceChildren(...all.map(([v, label]) => { const o = el("option", label); o.value = v; return o; }));
  if (!all.some((x) => x[0] === state.f)) state.f = "all";
  sel.value = state.f; $("search").value = state.q;
  const subtitle = DATA.sides.map((s) => `${s.manifest.label || s.id}: ${s.manifest.ref || "unknown ref"}`).join(" · ");
  $("subtitle").replaceChildren(subtitle + ` · ${DATA.cases.length} cases · generated ${new Date(DATA.generated).toLocaleString()}`);
  if (LIVE) $("subtitle").append(" · ", el("span", "live", "live"));
  renderSummary();

  const pred = all.find((x) => x[0] === state.f)[2];
  const q = state.q.toLowerCase();
  const rows = DATA.cases.filter((c) => pred(c) && (!q || c.text.toLowerCase().includes(q) || c.key.toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  state.p = Math.min(state.p, pages - 1);
  const focus = focusSide();
  const head = $("head"); head.replaceChildren(el("th", "Message"), el("th", "Case"), el("th", "Label"));
  for (const id of sides()) { const th = el("th", nameOf(id)); if (id === focus) th.className = "focus"; head.append(th); }
  const body = $("rows"); body.replaceChildren();
  for (const c of rows.slice(state.p * PAGE, state.p * PAGE + PAGE)) {
    const tr = el("tr");
    const msg = td(el("div", c.text, "snippet"), "msg"); msg.addEventListener("click", () => openCase(c.key)); tr.append(msg);
    const kase = el("div"); kase.append(el("div", c.source)); kase.append(el("div", c.id, "muted")); tr.append(td(kase));
    const label = el("div"); label.append(el("span", c.label === "malicious" ? "Attack" : "Benign", "badge " + c.label));
    if (c.well_known) label.append(el("div", c.well_known, "chip"));
    tr.append(td(label));
    for (const id of sides()) tr.append(td(badge(c[id], true), id === focus ? "focus" : ""));
    body.append(tr);
  }
  if (!rows.length) { const empty = td("No cases match this view."); empty.colSpan = 3 + sides().length; const tr = el("tr"); tr.append(empty); body.append(tr); }
  $("count").textContent = `${rows.length} of ${DATA.cases.length} cases`;
  $("page").textContent = `Page ${state.p + 1} of ${pages}`;
  $("prev").disabled = state.p === 0; $("next").disabled = state.p >= pages - 1;
  if (state.m && !$("dlg").open) openCase(state.m);
}

function openCase(key) {
  const c = DATA.cases.find((x) => x.key === key);
  if (!c) return;
  state.m = key; writeHash();
  $("dlg-title").textContent = key;
  const body = $("dlg-body"); body.replaceChildren();
  const meta = el("p"); meta.append(el("span", c.label === "malicious" ? "Attack" : "Benign", "badge " + c.label));
  if (c.well_known) meta.append(el("span", "well-known: " + c.well_known, "chip"));
  body.append(meta, el("pre", c.text));
  if (c.context) {
    const ctx = Object.entries(c.context).map(([k, v]) => `${k.replaceAll("_", " ")}:\n${v}`).join("\n\n");
    body.append(el("h3", "Context"), el("pre", ctx));
  }
  const grid = el("div", undefined, "sides");
  for (const id of sides()) {
    const r = c[id], box = el("div");
    box.append(el("strong", nameOf(id) + " "), badge(r, true));
    if (r) {
      if (r.m) box.append(el("div", r.m, "muted"));
      if (r.d) box.append(el("p", r.d));
      box.append(el("div", `$${(r.c || 0).toFixed(4)} · ${secs(r.t || 0)}`, "muted"));
    }
    grid.append(box);
  }
  body.append(grid);
  if (!$("dlg").open) $("dlg").showModal();
}

$("filter").addEventListener("change", () => { state.f = $("filter").value; state.p = 0; render(); writeHash(); });
$("search").addEventListener("input", () => { state.q = $("search").value; state.p = 0; render(); writeHash(); });
$("prev").addEventListener("click", () => { state.p--; render(); writeHash(); });
$("next").addEventListener("click", () => { state.p++; render(); writeHash(); });
$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => { state.m = ""; writeHash(); });
window.addEventListener("hashchange", () => { readHash(); render(); });

async function poll() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (res.ok) { DATA = await res.json(); render(); }
  } catch (e) { /* the run may still be starting */ }
}
readHash();
if (LIVE) { poll(); setInterval(poll, 5000); } else { render(); }
</script>
</body>
</html>
