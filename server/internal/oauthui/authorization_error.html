<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Authorization could not start — Speakeasy</title>
    <style>
      body {
        margin: 0;
        padding: 4rem 1rem;
        background: #fafafa;
        color: #333;
        font: 1rem/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 30rem;
        margin: 0 auto;
        padding: 2rem;
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 0.5rem;
        overflow-wrap: anywhere;
      }
      h1 { font-size: 1.6rem; line-height: 1.3; }
      code { font-size: 0.9rem; }
      a { color: #1e60af; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>Speakeasy</p>
      <h1>Authorization could not start</h1>
      <p><code>{{.Code}}</code></p>
      <p>{{.Description}}</p>
      <p>You can close this page, or return to the application with these error details. Continue only if you trust the destination.</p>
      <p><a href="{{.CallbackURL}}" rel="noreferrer">Return to {{.Destination}}</a></p>
    </main>
  </body>
</html>
