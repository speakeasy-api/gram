\* The wider check, run by hand before the design is signed off: about a
\* minute and 5 GB. It covers 3 slots, 2 renewal cycles (certificates 1 to
\* 3), 2 failed requests to Let's Encrypt or tsnet, and 2 lease holders lost
\* mid-request. Each also passes one step larger: 3 failed requests or 3
\* lost holders in about 65 s, 3 renewal cycles in about 2 minutes.
SPECIFICATION Spec
CONSTANTS
  Slots = {s1, s2, s3}
  MaxCycles = 2
  MaxIssuerFaults = 2
  MaxLostHolders = 2
  NoLease = FALSE
  RenewWithoutReread = FALSE
  ObtainOnHandshake = FALSE
  PerSlotRenewal = FALSE
  TsnetOrdersBlind = FALSE
  HolderOutlivesLease = FALSE
INVARIANTS
  TypeOK
  OneNewOrder
  OneRenewalPerCycle
  ServedIsIssued
PROPERTIES
  Converges
  Renews
