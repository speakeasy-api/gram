\* The everyday check: about 5 seconds. It covers 3 slots (the default per
\* connection), 1 renewal cycle, 1 failed request to Let's Encrypt or tsnet
\* (issuer down, rate limit, tsnet error), and 1 lease holder lost
\* mid-request, whose lease then lapses. CertificateLarge.cfg covers more.
\* Every constant from NoLease on is a design that was ruled out, or a
\* contract of tsnet or the lease broken; Certificate.tla says what each
\* breaks.
SPECIFICATION Spec
CONSTANTS
  Slots = {s1, s2, s3}
  MaxCycles = 1
  MaxIssuerFaults = 1
  MaxLostHolders = 1
  NoLease = FALSE
  RenewWithoutReread = FALSE
  ObtainOnHandshake = FALSE
  PerSlotRenewal = FALSE
  TsnetOrdersBlind = FALSE
  HolderOutlivesLease = FALSE
INVARIANTS
  TypeOK
  OneNewOrder
  OneRenewalPerCycle
  ServedIsIssued
PROPERTIES
  Converges
  Renews
