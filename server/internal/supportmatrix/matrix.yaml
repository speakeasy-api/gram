# The support matrix: which integration methods apply to which platforms and
# what each delivers per capability, per account type and operating system.
#
# This file is the only source. It is embedded in the server, read by the
# admin dashboard's Support matrix page and the Admin MCP, and validated by
# the tests in this package. To change it, open a pull request; CI runs the
# tests. Every method lists every platform, and a method that applies to a
# platform lists one cell per capability. A method that does not apply is not
# applicable for every capability there, and one whose applicability is
# unknown is unknown for every capability. Keep notes short and free of
# customer names, emails and ids: this repository is public.
capabilities:
  - id: org
    name: "Org-wide"
    group: "MCP Distribution"
  - id: role
    name: "Role-based"
    group: "MCP Distribution"
  - id: session
    name: "Session tracking"
    group: "Observability"
  - id: session-cost
    name: "Session cost"
    group: "Observability"
  - id: session-tokens
    name: "Session tokens"
    group: "Observability"
  - id: cost
    name: "Cost tracking"
    group: "Observability"
  - id: tokens
    name: "Token tracking"
    group: "Observability"
  - id: blocking
    name: "Blocking"
    group: "Security"
  - id: mcp-redaction
    name: "MCP redaction"
    group: "Security"
  - id: prompt-redaction
    name: "Prompt redaction"
    group: "Security"
  - id: shadow-mcp
    name: "Shadow MCP"
    group: "Shadow AI"
  - id: shadow-ai
    name: "Shadow AI"
    group: "Shadow AI"
