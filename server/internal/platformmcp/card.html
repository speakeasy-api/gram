<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speakeasy</title>
<style>
/* Neutrals follow the host's MCP Apps style variables when it sends them.
   Speakeasy brand colours mark only the primary action, the badge and the
   status, as the ChatGPT Apps guidelines ask. */
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(hsl(0 0% 100%), hsl(0 0% 13%)));
  --surface: var(--color-background-secondary, light-dark(hsl(0 0% 98%), hsl(0 0% 18%)));
  --fg: var(--color-text-primary, light-dark(hsl(0 0% 7%), hsl(0 0% 98%)));
  --muted: var(--color-text-secondary, light-dark(hsl(0 0% 33%), hsl(0 0% 73%)));
  --line: var(--color-border-primary, light-dark(hsl(0 0% 86%), hsl(0 0% 27%)));
  --accent: light-dark(hsl(214 69% 50%), hsl(215 77% 65%));
  --accent-fg: light-dark(hsl(0 0% 100%), hsl(220 100% 12%));
  --accent-text: light-dark(hsl(215 75% 31%), hsl(215 77% 72%));
  --done: light-dark(hsl(108 24% 41%), hsl(84 28% 56%));
  --action: light-dark(hsl(9 67% 51%), hsl(23 96% 62%));
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
}
p { margin: 0; overflow-wrap: anywhere; }
.card { padding: 16px 16px 14px; display: grid; gap: 10px; }
.card header { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark {
  flex: none; width: 40px; height: 40px; border-radius: var(--border-radius-md, 10px);
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line);
  font-weight: 600; font-size: 16px;
}
.heading { min-width: 0; flex: 1; }
h1 { margin: 0; font-size: 15px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 13px; }
.status {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.status-action::before { background: var(--action); }
.note {
  justify-self: start; font-size: 12px; font-weight: 500; padding: 2px 10px;
  color: var(--accent-text);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: var(--border-radius-full, 999px);
}
.next { color: var(--fg); }
.action {
  justify-self: start; margin-top: 2px; padding: 8px 16px;
  border: 1px solid var(--accent); border-radius: var(--border-radius-full, 999px);
  background: var(--accent); color: var(--accent-fg);
  font-weight: 600; text-decoration: none;
}
.action.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
.action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.brand {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 12px;
}
.brand svg { height: 13px; width: auto; margin-top: 2px; color: var(--fg); }
</style>
</head>

<script>
(function () {
  "use strict";
  // The card arrives already rendered and escaped by the server, in the tool
  // result's _meta. This shell only places it, follows the host theme, and
  // opens the card's one link through the host.
  var CARD_KEY = "com.speakeasy/card";
  var frame = document.getElementById("frame");
  var root = document.getElementById("card");
  var nextId = 1;
  var initializeId = 0;

  function post(message) {
    message.jsonrpc = "2.0";
    window.parent.postMessage(message, "*");
  }
  function request(method, params) {
    var id = nextId++;
    post({ id: id, method: method, params: params });
    return id;
  }
  function notify(method, params) {
    post({ method: method, params: params });
  }
  function setTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.style.colorScheme = theme;
    }
  }
  // MCP Apps hosts may send their own style variables; the card's neutrals
  // read them, so it matches the host's surfaces.
  function applyHostContext(context) {
    if (!context) {
      return;
    }
    setTheme(context.theme);
    var variables = context.styles && context.styles.variables;
    for (var name in variables || {}) {
      if (/^--[a-z0-9-]+$/.test(name) && typeof variables[name] === "string") {
        document.documentElement.style.setProperty(name, variables[name]);
      }
    }
  }
  // A result without a card, such as a refusal, clears any earlier card,
  // hides the frame and reports zero height so the host can collapse it.
  function render(meta) {
    var card = meta && meta[CARD_KEY];
    root.innerHTML = typeof card === "string" ? card : "";
    frame.hidden = root.innerHTML === "";
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: frame.offsetHeight
    });
  }

  window.addEventListener("message", function (event) {
    var message = event.data;
    if (event.source !== window.parent || !message || message.jsonrpc !== "2.0") {
      return;
    }
    if (message.id === initializeId && message.result) {
      applyHostContext(message.result.hostContext);
      notify("ui/notifications/initialized", {});
    } else if (message.method === "ui/notifications/tool-result") {
      render(message.params && message.params._meta);
    } else if (message.method === "ui/notifications/host-context-changed") {
      applyHostContext(message.params);
    }
  });

  root.addEventListener("click", function (event) {
    var link = event.target.closest && event.target.closest("a[href]");
    if (!link) {
      return;
    }
    var url = link.href;
    if (!/^https?:\/\//i.test(url)) {
      event.preventDefault();
      return;
    }
    // A sandboxed view cannot open a window itself; the host opens the link.
    event.preventDefault();
    if (window.openai && typeof window.openai.openExternal === "function") {
      window.openai.openExternal({ href: url });
    } else {
      request("ui/open-link", { url: url });
    }
  });

  initializeId = request("ui/initialize", {
    appInfo: { name: "speakeasy-platform-card", version: "1" },
    appCapabilities: {},
    protocolVersion: "2026-01-26"
  });

  // ChatGPT also exposes the result directly on window.openai.
  function renderFromOpenAI() {
    setTheme(window.openai.theme);
    render(window.openai.toolResponseMetadata);
  }
  if (window.openai) {
    renderFromOpenAI();
    window.addEventListener("openai:set_globals", renderFromOpenAI);
  }
})();
</script>
