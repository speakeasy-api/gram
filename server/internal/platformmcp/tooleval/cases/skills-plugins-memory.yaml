# Skill usage today (24h counts, people) versus 30-day payoff and per-version comparison.
- id: skill-usage-activations-default
  prompt: How many skill activations have we had in the Default project over the last 24 hours?
  expect: [query_skill_usage]
  args:
    project_id: 0b7c3d1e-0000-4000-8000-000000000001
    window: 24h
- id: skill-usage-users-release-notes
  prompt: who's been using release-notes in Default today?
  expect: [list_skill_usage_users]
  allow: [query_skill_usage, list_skills, get_skill]
  args:
    project_id: 0b7c3d1e-0000-4000-8000-000000000001
    skill_name: release-notes
- id: skill-usage-users-named-person
  prompt: Has Priya Shah used the release-notes skill in Default at all today?
  expect: [list_skill_usage_users]
  allow: [query_skill_usage, list_skills, get_skill]
  args:
    skill_name: release-notes
- id: skill-usage-user-status-reference
  prompt: In that release-notes usage list for Default, person reference subj-4b1d9e came up. Confirm whether they activated release-notes in the same 24 hour window.
  expect: [get_user_skill_status]
  args:
    project_id: 0b7c3d1e-0000-4000-8000-000000000001
    skill_name: release-notes
    subject_reference: subj-4b1d9e
- id: skill-insights-worth-keeping
  prompt: I want to prune our skills in Default. Which ones are actually saving people time this month, and which are dead weight?
  expect: [list_skill_insights]
  args:
    project_slug: default
- id: skill-insights-vs-counts
  prompt: Not raw activation counts please. Rank the skills in Default by how well they score.
  expect: [list_skill_insights]
  args:
    project_slug: default
    sort_by: efficacy
- id: skill-compare-versions
  prompt: We shipped a new version of release-notes in Default last week. Is it doing any better than the old one?
  expect: [compare_skill_versions]
  allow: [list_skills, get_skill, list_skill_versions]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051

# Reading skills: the list, one skill, its history.
- id: skill-list-payments
  prompt: what skills do we have in Payments?
  expect: [list_skills]
  args:
    project_slug: payments
- id: skill-get-release-notes
  prompt: Show me the full instructions the release-notes skill in Default gives the agent.
  expect: [get_skill]
  allow: [list_skills]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
    include_content: true
- id: skill-list-versions
  prompt: How many revisions has release-notes in Default been through, and when did each one land?
  expect: [list_skill_versions]
  allow: [list_skills, get_skill]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051

# Feedback and proposed improvements.
- id: skill-feedback-release-notes
  prompt: Are people complaining about release-notes in Default? I'd like to see what users have said about it.
  expect: [list_skill_feedback]
  allow: [list_skills, get_skill]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
- id: skill-suggestions-open
  prompt: Is anything waiting for me to review in terms of suggested edits to skills in Default?
  expect: [list_skill_suggestions]
  allow: [list_skills]
  args:
    project_slug: default
- id: skill-suggestion-evidence
  prompt: Change 2f6e1a3b-7c8d-4e9f-a0b1-c2d3e4f5a6b7 in the open suggestion for release-notes in Default, what user feedback is it based on?
  expect: [list_skill_suggestion_feedback]
  allow: [list_skill_suggestions]
  args:
    project_slug: default
    change_id: 2f6e1a3b-7c8d-4e9f-a0b1-c2d3e4f5a6b7
- id: skill-suggestion-approve
  prompt: The proposed improvement to release-notes in Default looks good. Accept it.
  expect: [approve_skill_suggestion]
  allow:
    [
      list_skills,
      get_skill,
      list_skill_suggestions,
      list_skill_suggestion_feedback,
    ]
  args:
    project_slug: default
- id: skill-suggestion-approve-with-fix
  prompt: Take the suggested rewrite of release-notes in Default, but fix the typo in its second step before it goes in. I want the suggestion closed afterwards.
  expect: [approve_skill_suggestion]
  allow:
    [
      list_skills,
      get_skill,
      list_skill_suggestions,
      list_skill_suggestion_feedback,
    ]
  args:
    project_slug: default
- id: skill-suggestion-dismiss
  prompt: Throw away the suggested rewrite of release-notes in Default, it misunderstands what the skill is for.
  expect: [dismiss_skill_suggestion]
  allow: [list_skills, get_skill, list_skill_suggestions]
  args:
    project_slug: default

# Writing skills: new skill, new instructions, new name or summary.
- id: skill-create-incident-triage
  prompt: |
    Add a new skill to Default. Here's the full SKILL.md:
    ---
    name: incident-triage
    description: Triage a production incident from an alert link.
    ---
    Read the alert, find the owning service, and post a summary in the incident channel.
  expect: [create_skill]
  allow: [list_skills]
  args:
    project_slug: default
    content: incident-triage
- id: skill-add-version-group-by-component
  prompt: Change release-notes in Default so the agent groups every change by component before writing the summary.
  expect: [add_skill_version]
  allow: [list_skills, get_skill, list_skill_versions]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
- id: skill-rename-release-notes
  prompt: Rename release-notes in Default to changelog-writer.
  expect: [update_skill_metadata]
  allow: [list_skills, get_skill]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
    name: changelog-writer
- id: skill-metadata-summary-only
  prompt: Just change the one-line summary of release-notes in Default to "Drafts release notes from merged PRs". Leave its actual instructions alone.
  expect: [update_skill_metadata]
  allow: [list_skills, get_skill]
  args:
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
    summary: merged PRs

# Sharing skills: plugins (distribute) versus serving them from an MCP server or gateway (link).
- id: skill-distribute-to-engineering-plugin
  prompt: Add the release-notes skill in Default to the Engineering plugin so the engineers get it.
  expect: [distribute_skill]
  allow:
    [list_skills, get_skill, list_plugins, get_plugin, list_skill_distributions]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
- id: skill-list-distributions
  prompt: Which plugins in Default are carrying which skills right now?
  expect: [list_skill_distributions]
  allow: [list_skills, list_plugins]
  args:
    project_slug: default
- id: skill-undistribute-from-engineering
  prompt: Pull release-notes out of the Engineering plugin in Default. Leave the skill itself in place.
  expect: [undistribute_skill]
  allow:
    [list_skills, get_skill, list_plugins, get_plugin, list_skill_distributions]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
- id: skill-link-to-github-mcp
  prompt: Any client connected straight to the GitHub MCP server in Default should be able to load release-notes from that server.
  expect: [link_skill_to_mcp]
  allow: [list_skills, get_skill, list_skill_versions, find_mcp, get_mcp]
  args:
    project_slug: default
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
    target_kind: mcp_server
- id: skill-link-to-org-gateway
  prompt: Expose release-notes from Default through Acme Gateway too, so anyone on the gateway can load it.
  expect: [link_skill_to_mcp]
  allow: [list_skills, get_skill, list_skill_versions, find_mcp, get_mcp]
  args:
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
    target_kind: organization_gateway
- id: skill-unlink-from-org-gateway
  prompt: stop acme gateway from serving the release-notes skill from Default
  expect: [unlink_skill_from_mcp]
  allow: [list_skills, get_skill, list_skill_distributions, find_mcp, get_mcp]
  args:
    skill_id: 9e8d7c00-0000-4000-8000-000000000051
    target_kind: organization_gateway

