openapi: 3.1.0
info:
  title: Speakeasy end-to-end test contract
  version: "2"
  description: >-
    The operations an end-to-end test run calls outside the browser: the control
    surface (server/internal/e2econtrol, local stacks only) and the two public
    API reads the suite's root uses to check the seeded state. A test tool pins
    this file by its SHA-256, so changing it re-plans the flows that name it. It
    is hand-written because the control surface is deliberately absent from the
    public API (server/gen/http/openapi3.yaml); the two public reads are the
    subset of that file the root needs, kept here so the tool has one contract.
security:
  - control: []
paths:
  /rpc/e2e.tenant:
    get:
      operationId: e2eTenant
      description: Name the test organization and the build being served. Reads only.
      responses:
        "200":
          description: The test organization
          content:
            application/json:
              schema:
                type: object
                required:
                  [organization_slug, project_slug, seeded_user_prefix, build]
                properties:
                  organization_slug:
                    type: string
                  project_slug:
                    type: string
                  seeded_user_prefix:
                    type: string
                  build:
                    type: string
  /rpc/e2e.reseed:
    post:
      operationId: e2eReseed
      description: Replace the test organization's data with the seed. Takes no input.
      responses:
        "204":
          description: The test organization was reseeded
        "409":
          description: Another seed run is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /rpc/e2e.signInLink:
    post:
      operationId: e2eSignInLink
      description: Mint a path that signs a browser in as the test user, once, within a minute.
      responses:
        "200":
          description: A one-time sign-in path on the dashboard origin
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path:
                    type: string
  /rpc/toolsets.get:
    get:
      operationId: getToolset
      security:
        - apiKey: []
          project: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The MCP server (toolset)
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  slug:
                    type: string
                  tools:
                    type: array
                    items:
                      type: object
  /rpc/access.listRoles:
    get:
      operationId: listRoles
      security:
        - apiKey: []
      responses:
        "200":
          description: The organization's roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                        is_system:
                          type: boolean
components:
  securitySchemes:
    control:
      type: apiKey
      in: header
      name: Gram-E2E-Token
    apiKey:
      type: apiKey
      in: header
      name: Gram-Key
    project:
      type: apiKey
      in: header
      name: Gram-Project
  schemas:
    Problem:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
