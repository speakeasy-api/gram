<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="robots" content="noindex, nofollow"/><title>Give agents access | Speakeasy</title><style>{{.Styles}}</style></head>
<body class="bg-background text-foreground min-h-screen">
<main class="mx-auto flex min-h-screen w-full max-w-[52rem] flex-col gap-6 px-4 py-12 sm:py-16">
<header>{{template "speakeasyWordmark" .}}</header>
<section class="bg-card border">
<div class="border-b px-6 py-6 sm:px-8"><p class="text-sm text-muted-foreground">Connection ready</p><h1 class="mt-2 text-2xl font-semibold">Give agents access</h1><p class="mt-2 text-sm text-muted-foreground">Your sign-in is complete. Optionally let agents use the connection you just authorized. This does not change who your MCP client runs as.</p></div>
<form data-delegation-form action="{{.ActionURL}}" data-continue-url="{{.ContinueURL}}" method="POST">
{{template "agentDelegationFields" .}}
<div class="border-t px-6 py-6 sm:px-8"><p role="alert" data-delegation-error class="mb-4 text-sm" hidden></p><div class="flex gap-3"><button type="submit" data-grant-agents class="bg-primary text-primary-foreground h-10 px-6 text-sm disabled:cursor-not-allowed disabled:bg-muted disabled:text-muted-foreground" disabled>Grant access</button><button type="button" data-skip-delegation class="bg-card interact:bg-accent h-10 border px-6 text-sm">Skip</button></div></div>
</form></section></main><script src="{{.ScriptURL}}" defer></script></body></html>
