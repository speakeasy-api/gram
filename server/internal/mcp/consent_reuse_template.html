<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Connecting — Speakeasy</title>
    <style>
      {{.Styles}}
    </style>
  </head>
  <body class="bg-background text-foreground min-h-screen">
    <main
      class="mx-auto flex min-h-screen w-full max-w-[52rem] flex-col gap-6 px-4 py-12 sm:py-16"
    >
      <div class="text-foreground">{{template "speakeasyWordmark"}}</div>

      <section class="bg-card border" aria-labelledby="checking-heading">
        <div class="flex flex-col gap-4 px-6 py-8 sm:px-8" role="status">
          <h1 id="checking-heading" class="text-display-xs flex items-center gap-3">
            <svg
              class="text-muted-foreground size-5 shrink-0 animate-spin motion-reduce:animate-none"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" opacity="0.2" />
              <path d="M12 3a9 9 0 0 1 9 9" />
            </svg>
            <span>Checking sign-in status...</span>
          </h1>
          <p class="text-sm text-muted-foreground">
            No action needed. You’ll continue automatically if your prior sign-in
            is still valid.
          </p>
        </div>
        <div class="border-t px-6 py-6 sm:px-8">
          <a
            href="{{.Fallback}}"
            class="bg-card interact:bg-accent inline-flex h-10 w-full items-center justify-center border px-6 text-sm sm:w-auto"
            >Review access</a
          >
        </div>
      </section>

      <p class="text-xs text-muted-foreground">Secured by Speakeasy.</p>

      <form
        id="consent-reuse"
        action="{{.Path}}"
        method="post"
        data-tools-url="{{.ToolsURL}}"
        data-fallback="{{.Fallback}}"
        hidden
      >
        <input type="hidden" name="state" value="{{.State}}" />
        <input type="hidden" name="csrf_token" value="{{.CSRF}}" />
        <input type="hidden" name="action" value="reuse" />
        <input type="hidden" name="tool_inventory_id" value="" />
      </form>
    </main>
    <script type="module" src="{{.Script}}"></script>
  </body>
</html>
