version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.5.10@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
    container_name: clickhouse-dev
    ports:
      - "8124:8123" # HTTP interface
      - "9001:9000" # Native protocol
    environment:
      CLICKHOUSE_DB: gram_example
      CLICKHOUSE_USER: gram_user
      CLICKHOUSE_PASSWORD: gram_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
  clickhouse_logs:
