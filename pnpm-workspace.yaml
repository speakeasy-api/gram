packages:
  - client/*
  - sdks/*
  - ts-framework/*
  - ts-framework/create-function/*
  - "!ts-framework/create-function/gram-template-*"
  - server
  - cli
  - tunnel
  - functions
  - docs
  - evaluation
  - dev-idp-dashboard
  - e2e

catalog:
  "@ai-sdk/react": ^4.0.95
  "@cfworker/json-schema": ^4.1.1
  "@modelcontextprotocol/sdk": ^1.30.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": 5.101.4
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@assistant-ui/react": ^0.15.17
  "@vitejs/plugin-react": ^6.0.5
  ai: ^7.0.92
  "lucide-react": ^1.28.0
  typescript: 7.0.2
  vite: ^8.2.0

autoInstallPeers: false

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "typescript"
  - "@typescript/*"
  - "@oxfmt/*"
  - "oxfmt"
  - "fast-uri"
  - "react-router"
  - "@chromatic-com/storybook"

overrides:
  # Keep assistant-ui's SDK dependencies aligned with the dashboard: newer AI
  # stream chunks are not assignable to the older ChatTransport types.
  ai: 7.0.91
  "@ai-sdk/react": 4.0.94
  glob@>=10.0 <10.5.0: 10.5.0
  fast-uri@<3.1.5: 3.1.5
  # Radix sub-packages pin exact react-dismissable-layer versions, so mixed Radix
  # releases load multiple copies with separate layer-stack contexts — nested dismiss
  # layers then can't see each other (e.g. the filter sheet closing when dismissing a
  # dropdown inside it, DNO-393/AIS-168). Force one copy so all primitives share a stack.
  "@radix-ui/react-dismissable-layer": 1.1.13
  # Vite's optional Node types peer is runtime-irrelevant, but differing patch
  # versions mint separate Vite instances. TanStack Start checks its Vite
  # environment by identity, so keep the Vite peer set converged.
  "vite>@types/node": ^24.13.3
  # @assistant-ui/core must resolve to a single instance: its React contexts
  # (e.g. RuntimeAdapterProvider) are shared between @assistant-ui/react and
  # @assistant-ui/react-ai-sdk, and pnpm mints a separate core instance per
  # distinct peer set — splitting the context and silently breaking chat
  # history loading (AGE-2977). Pin assistant-cloud's optional peer and keep
  # the dashboard's Zustand version aligned with @assistant-ui/react so both
  # runtime paths resolve core with the same peer set.
  assistant-cloud: 0.1.42

peerDependencyRules:
  allowedVersions:
    # 0.10.0 is the latest release and predates vite 8; the plugin only reads
    # package.json to compute build externals, so vite 8 is fine.
    "vite-plugin-externalize-deps>vite": "^8.0.0"

allowBuilds:
  bun: true
  esbuild: true
  sharp: true
  core-js: false
  cpu-features: false
  msw: false
  ssh2: false
  "@openrouter/sdk": false
