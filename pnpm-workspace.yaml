packages:
  - client/*
  - sdks/*
  - ts-framework/*
  - ts-framework/create-function/*
  - server
  - cli
  - tunnel
  - functions
  - docs
  - evaluation
  - dev-idp-dashboard
  - e2e

catalog:
  "@ai-sdk/react": ^4.0.175
  "@cfworker/json-schema": ^4.1.1
  "@modelcontextprotocol/sdk": ^1.32.0
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-query": 5.107.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@assistant-ui/react": ^0.15.37
  "@vitejs/plugin-react": ^6.3.0
  ai: ^7.0.171
  "lucide-react": ^1.28.0
  typescript: 7.0.2
  vite: ^8.3.7

autoInstallPeers: false

# Without this, dashboard/admin vitest shares a @vitest/mocker built on the
# functions workspace's @types/node 22 vite instead of its own 24 one.
dedupePeerDependents: false

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "typescript"
  - "@typescript/*"
  - "@oxfmt/*"
  - "oxfmt"
  - "react-router"
  - "@chromatic-com/storybook"

overrides:
  # @ai-sdk/react depends on an exact ai version. Keep both pinned together so
  # the dashboard, @ai-sdk/react, and the ai peers of @assistant-ui/react-ai-sdk
  # and assistant-stream all resolve to one ai instance.
  ai: 7.0.171
  "@ai-sdk/react": 4.0.175
  # monaco-editor pins dompurify exactly; 3.4.15 has open XSS advisories.
  # 3.4.17 also fixes GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr in 3.4.16.
  dompurify@<3.4.17: 3.4.17
  # Radix sub-packages pin exact react-dismissable-layer versions, so mixed Radix
  # releases load multiple copies with separate layer-stack contexts — nested dismiss
  # layers then can't see each other (e.g. the filter sheet closing when dismissing a
  # dropdown inside it, DNO-393/AIS-168). Force one copy so all primitives share a stack.
  "@radix-ui/react-dismissable-layer": 1.2.1
  # Vite's optional Node types peer is runtime-irrelevant, but differing patch
  # versions mint separate Vite instances. TanStack Start checks its Vite
  # environment by identity, so keep the Vite peer set converged.
  "vite>@types/node": ^24.13.3

peerDependencyRules:
  allowedVersions:
    # 0.10.0 is the latest release and predates vite 8; the plugin only reads
    # package.json to compute build externals, so vite 8 is fine.
    "vite-plugin-externalize-deps>vite": "^8.0.0"

allowBuilds:
  bun: true
  esbuild: true
  sharp: true
  core-js: false
  cpu-features: false
  msw: false
  ssh2: false
  "@openrouter/sdk": false
